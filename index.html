<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Proyectos Especiales · Línea Italia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FB; --card:#FFFFFF; --navy:#0F1535; --navy2:#1A2149;
  --accent:#2563EB; --txt:#1C1F3B; --txt2:#5A6080; --txt3:#9096B0;
  --line:#E6E9F2; --panel:#F1F3FA;
  /* estados monday */
  --s-noini:#C4C4C4; --s-listo:#579BFC; --s-proc:#FDAB3D; --s-rev:#A25DDC; --s-bloq:#E2445C; --s-term:#00C875;
  --shadow:0 1px 4px rgba(15,21,53,.07); --shadow-lg:0 12px 32px rgba(15,21,53,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:70px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.mono{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{height:10px;width:10px}::-webkit-scrollbar-thumb{background:#D4D9E8;border-radius:6px}

.app{display:flex;min-height:100vh}
.side{width:240px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2563EB,#60A5FA);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.side-brand b{font-size:14px;font-weight:700;display:block;line-height:1.1}
.side-brand span{color:var(--txt3);font-size:10px;font-family:'DM Mono';text-transform:uppercase;letter-spacing:.1em}
.side-sec{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.1em;font-family:'DM Mono';padding:6px 10px 4px}
.side-ws{font-size:13px;font-weight:700;padding:4px 10px 10px;display:flex;align-items:center;gap:7px}
.side-ws::before{content:"M";width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,#7C3AED,#A25DDC);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav button{text-align:left;font-size:13px;font-weight:500;color:var(--txt2);padding:8px 10px 8px 16px;border-radius:8px;display:flex;align-items:center;gap:8px}
.side-nav button:hover{background:var(--panel)}
.side-nav button.on{background:var(--accentSoft,#E9F0FE);color:var(--accent);font-weight:600}
.side-nav .ico{width:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--txt3)}
.side-nav button.on .ico{color:var(--accent)}
.side-nav .proj{padding-left:26px;font-size:12.5px}
.side-nav .subhead{font-size:9.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.09em;font-family:'DM Mono';padding:10px 10px 3px}
.side-imp{text-align:left;font-size:12px;font-weight:600;color:var(--accent);padding:9px 12px;border-radius:8px;border:1px solid var(--line);margin-top:8px}
.side-imp:hover{background:var(--panel)}
.main{flex:1;min-width:0;padding:26px 34px 60px;max-width:1680px}
.famfilt{display:flex;gap:5px}
.famfilt button{font-size:11px;font-weight:600;color:var(--txt2);padding:4px 11px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.famfilt button:hover{border-color:var(--accent);color:var(--accent)}
.famfilt button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:820px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:4px}.side-nav{flex-direction:row;flex-wrap:wrap}.main{padding:16px}}
.view{display:none}.view.on{display:block}
.eyebrow{font-family:'DM Mono';font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.h1{font-size:25px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--txt2);font-size:14px;margin-top:7px;max-width:80ch;line-height:1.5}

/* resumen strip */
.strip{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 16px;box-shadow:var(--shadow);flex:1;min-width:150px}
.chip .k{font-size:11px;color:var(--txt3)}.chip .v{font-size:21px;font-weight:700;margin-top:3px}

/* BOARD */
.board{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.board-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.board-head .gc{width:6px;height:22px;border-radius:3px}
.board-head h3{font-size:15px;font-weight:700}
.board-head .count{font-size:12px;color:var(--txt3);margin-left:2px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:8px 12px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3);font-weight:600;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl.fixed{table-layout:fixed}
.tbl.fixed td{overflow:hidden}
.tbl.fixed .actv{word-break:break-word;display:block}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover{background:#FBFCFE}
.cellpad{padding:6px 12px}
.grpbar{width:11px;padding:0!important;text-align:center;vertical-align:middle}
.gbar{display:inline-block;width:4px;height:20px;border-radius:4px;vertical-align:middle}
.actv{font-weight:600;color:var(--txt);font-size:12.5px}
.fase-lbl{font-size:11px;color:var(--txt3)}

/* persona chip */
.person{display:inline-flex;align-items:center;gap:7px}
.ava{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}

/* estado / prioridad: pastilla compacta con aire alrededor */
.estado{display:block;margin:5px 10px;height:26px;line-height:26px;border:none;color:#fff;font-weight:600;font-size:11.5px;text-align:center;cursor:pointer;-webkit-appearance:none;appearance:none;text-align-last:center;border-radius:6px;width:calc(100% - 20px);padding:0 6px}
.estado option{color:#1C1F3B;background:#fff}

/* avance */
.avance{display:flex;align-items:center;gap:8px;padding:7px 12px}
.avbar{flex:1;height:8px;background:var(--panel);border-radius:6px;overflow:hidden;min-width:54px}
.avfill{height:100%;border-radius:6px;background:var(--s-term)}
.avnum{font-size:11px;color:var(--txt2);font-family:'DM Mono';width:32px;text-align:right}

.datecell input{border:1px solid transparent;background:transparent;font-family:'DM Mono';font-size:11.5px;color:var(--txt2);padding:6px 8px;width:112px;border-radius:6px}
.datecell input:hover{border-color:var(--line);background:#fff}

.legend{display:flex;gap:9px;flex-wrap:wrap;margin:6px 0 18px}
.legend .l{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt2);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 11px}
.legend .sw{width:11px;height:11px;border-radius:3px}

.btn{background:var(--accent);color:#fff;font-weight:600;font-size:13px;padding:8px 15px;border-radius:9px}
.btn:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--card);color:var(--txt2);border:1px solid var(--line);font-weight:600;font-size:13px;padding:8px 15px;border-radius:9px}
.addrow{padding:11px 18px;color:var(--txt3);font-size:13px;font-weight:600;cursor:pointer;border-top:1px dashed var(--line)}
.addrow:hover{color:var(--accent);background:#FBFCFE}

/* master board rows */
.mrow{cursor:pointer}
.mname{font-weight:700;font-size:14px;line-height:1.35}.mcli{font-size:11.5px;color:var(--txt3);line-height:1.3;margin-top:1px}
.delbtn{width:24px;height:24px;border-radius:6px;color:var(--txt3);font-size:12px;opacity:0;transition:.15s}
.mrow:hover .delbtn{opacity:1}
.delbtn:hover{background:var(--s-bloq);color:#fff}
.tbl .mrow td{padding-top:2px;padding-bottom:2px}
.tbl .airow td{padding-top:5px;padding-bottom:5px}
.tbl .airow .cellpad{padding-top:12px;padding-bottom:12px}

.back{color:var(--accent);font-size:13px;font-weight:600;margin-bottom:14px;display:inline-flex;gap:5px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,21,53,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:480px;width:100%;box-shadow:var(--shadow-lg)}
.modal h3{font-size:17px;font-weight:700;margin-bottom:14px}
.modal label{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin:10px 0 4px}
.modal input,.modal select{width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.foot{text-align:center;color:var(--txt3);font-size:11px;margin-top:26px;font-family:'DM Mono'}
.ptabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:16px 0 18px}
.ptabs button{font-size:13px;font-weight:600;color:var(--txt2);padding:9px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button:hover{color:var(--txt)}
.ptabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.kanban{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.kcol{background:var(--panel);border-radius:11px;padding:10px;min-height:90px}
.kcol h4{font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-family:'DM Mono';margin-bottom:9px;font-weight:700}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;box-shadow:var(--shadow)}
.kcard .kt{font-size:12px;font-weight:600;line-height:1.3;margin-bottom:6px}
.kcard .km{display:flex;align-items:center;justify-content:space-between;gap:6px}
.kcard .kmove{width:100%;font-size:10px;padding:3px 5px;margin-top:7px;border:1px solid var(--line);border-radius:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-head div{text-align:center;font-size:10.5px;color:var(--txt3);font-weight:700;font-family:'DM Mono';padding-bottom:4px}
.cal-cell{min-height:88px;background:var(--panel);border-radius:8px;padding:6px 7px}
.cal-cell.empty{background:transparent}
.cal-cell.hoy{outline:2px solid var(--accent)}
.cal-d{font-size:11px;color:var(--txt3);font-weight:600;margin-bottom:3px}
.cal-ev{font-size:10.5px;line-height:1.3;padding:3px 5px;border-radius:4px;margin-bottom:3px;overflow:hidden}
.dashgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dashgrid .board{margin-bottom:0}
@media(max-width:800px){.kanban{grid-template-columns:1fr 1fr}.dashgrid{grid-template-columns:1fr}}
@media(max-width:800px){.tbl{font-size:12.5px}.wrap{padding:16px}}
</style>
</head>

const $=s=>document.querySelector(s);

const money0=n=>"$"+Number(n||0).toLocaleString("es-MX",{maximumFractionDigits:0});
function diasA(f){if(!f)return null;return Math.ceil((new Date(f+"T00:00:00")-new Date(new Date().toDateString()))/86400000);}
function ava(nombre){const ini=(nombre||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();const col=PERSON_COLOR[nombre]||"#8A90B0";return `<span class="ava" style="background:${col}">${ini}</span>`;}
function proy(id){return STATE.proyectos.find(p=>p.id===id);}
function avanceProy(p){if(!p.actividades.length)return 0;return Math.round(p.actividades.reduce((a,x)=>a+(x.avance||0),0)/p.actividades.length);}
function bloqueados(p){return p.actividades.filter(a=>a.estado==="Bloqueado").length;}
function faseActual(p){const enc=p.actividades.find(a=>a.estado!=="Terminado");return enc?enc.fase:"Cierre";}
function estadoProy(p){if(bloqueados(p))return "Bloqueado";const av=avanceProy(p);if(av>=100)return "Terminado";if(av>0)return "En proceso";return "Listo para comenzar";}

/* ===== AUTOMATIZACIONES (reglas del spec, hechas visibles como alertas) ===== */
function actsOrdenadas(p){return [...p.actividades].sort((a,b)=>{
  const fa=FASE_ORDEN.indexOf(a.fase),fb=FASE_ORDEN.indexOf(b.fase);
  if(fa!==fb)return fa-fb; return new Date(a.entrega||"2999")-new Date(b.entrega||"2999");});}
function alertasProy(p){
  const al=[];
  // Regla 1: vencida y no terminada -> avisar responsable
  p.actividades.forEach(a=>{const d=diasA(a.entrega);if(a.estado!=="Terminado"&&d!=null&&d<0)
    al.push({icon:"🔴",color:"var(--s-bloq)",txt:`<b>${esc(a.actividad)}</b> venció hace ${-d}d y no está terminada → avisar a <b>${esc(a.resp)}</b>`});});
  // Regla 2: bloqueado -> avisar PM
  p.actividades.forEach(a=>{if(a.estado==="Bloqueado")
    al.push({icon:"🚫",color:"var(--s-bloq)",txt:`<b>${esc(a.actividad)}</b> está bloqueada → avisar al Project Manager`});});
  // Regla 3: terminada cuya siguiente no ha iniciado -> avisar al siguiente
  const ord=actsOrdenadas(p);
  for(let i=0;i<ord.length-1;i++){if(ord[i].estado==="Terminado"&&ord[i+1].estado==="No iniciado")
    al.push({icon:"➡️",color:"var(--s-listo)",txt:`Lista <b>${esc(ord[i].actividad)}</b> → arranca la siguiente: <b>${esc(ord[i+1].actividad)}</b> (${esc(ord[i+1].resp)})`});break;}
  // Regla 4: todo terminado -> cerrar
  if(p.actividades.length&&p.actividades.every(a=>a.estado==="Terminado"))
    al.push({icon:"✅",color:"var(--s-term)",txt:`Todas las actividades terminadas → <b>cerrar el proyecto</b>`});
  return al;
}

/* ===== DASHBOARD / SEGUIMIENTO SEMANAL ===== */
function plannedPct(a){
  if(a.estado==="Terminado")return 100;
  if(!a.inicio||!a.entrega)return 0;
  const t0=new Date(a.inicio),t1=new Date(a.entrega),now=new Date(new Date().toDateString());
  if(now>=t1)return 100; if(now<=t0)return 0;
  return Math.round((now-t0)/(t1-t0)*100);
}
function planReal(p){
  if(!p.actividades.length)return {plan:0,real:0};
  const plan=Math.round(p.actividades.reduce((a,x)=>a+plannedPct(x),0)/p.actividades.length);
  const real=avanceProy(p);
  return {plan,real};
}
function vencidas(p){return p.actividades.filter(a=>{const d=diasA(a.entrega);return a.estado!=="Terminado"&&d!=null&&d<0;});}
function proxHitos(p,n){return actsOrdenadas(p).filter(a=>a.estado!=="Terminado").slice(0,n);}

/* --- SUB: TABLA PRINCIPAL --- */
function subTabla(p){

  grupos.sort((x,y)=>{const ix=FASE_ORDEN.indexOf(x),iy=FASE_ORDEN.indexOf(y);return (ix<0?99:ix)-(iy<0?99:iy);});
  const ord=actsOrdenadas(p);
  ord.forEach((a,i)=>a._num=i+1);
  const depDe=a=>{const i=ord.findIndex(x=>x.id===a.id);return i>0?ord[i-1].actividad:"—";};
  let n=0;
  const boards=grupos.map(g=>{
    n++;const col=GRUPO_COLOR[g]||"#8A90B0";
    const rows=seen[g].map(a=>{
      const dd=diasA(a.entrega),atras=a.estado!=="Terminado"&&dd!=null&&dd<0;
      return `<tr>
        <td class="grpbar"><span class="gbar" style="background:${col}"></span></td>
        <td style="width:24px;text-align:center;color:var(--txt3);font-family:'DM Mono';font-size:11px">${(a._num||'')}</td>
        <td class="cellpad"><span class="actv">${esc(a.actividad)}</span></td>
        <td class="cellpad"><span class="person">${ava(a.resp)}<span>${esc(a.resp)}</span></span></td>
        <td class="datecell"><input type="date" value="${a.inicio||''}" onchange="updAct('${a.id}','inicio',this.value)"></td>
        <td class="datecell"><input type="date" value="${a.entrega||''}" onchange="updAct('${a.id}','entrega',this.value)">${atras?'<div style="font-size:9px;color:var(--s-bloq);padding-left:10px;font-weight:700">ATRASADA</div>':''}</td>
        <td><select class="estado" style="background:${COLOR[a.estado]}" onchange="updEstado('${a.id}',this.value)">${ESTADOS.map(e=>`<option ${e===a.estado?'selected':''}>${e}</option>`).join("")}</select></td>
        <td style="width:130px"><div class="avance"><div class="avbar"><div class="avfill" style="width:${a.avance}%;background:${COLOR[a.estado]}"></div></div><span class="avnum">${a.avance}%</span></div></td>
        <td><select class="estado" style="background:${PRIORIDAD[a.prioridad]}" onchange="updAct('${a.id}','prioridad',this.value)">${Object.keys(PRIORIDAD).map(x=>`<option ${x===a.prioridad?'selected':''}>${x}</option>`).join("")}</select></td>
        <td class="cellpad" style="font-size:12px;color:var(--txt3)">${esc(depDe(a))}</td>
      </tr>`;
    }).join("");
    return `<div class="board">
      <div class="board-head"><span class="gc" style="background:${col}"></span><h3>${n}. ${esc(g)}</h3><span class="count">${seen[g].length}</span></div>
      <table class="tbl fixed"><colgroup><col style="width:11px"><col style="width:34px"><col><col style="width:150px"><col style="width:118px"><col style="width:118px"><col style="width:148px"><col style="width:128px"><col style="width:108px"><col style="width:210px"></colgroup><thead><tr><th style="width:11px"></th><th>#</th><th>Actividad</th><th>Responsable</th><th>Inicio</th><th>Entrega</th><th style="text-align:center">Estado</th><th>Avance</th><th style="text-align:center">Prioridad</th><th>Dependencia</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="addrow" onclick="modalNuevaActividad('${g}')">+ Agregar actividad a ${esc(g)}</div>
    </div>`;
  }).join("");
  return renderAlertasCard(alertasProy(p),"Alertas y automatizaciones")+leyenda()+boards;
}

/* --- SUB: GANTT --- */
function subGantt(p){
  const acts=actsOrdenadas(p).filter(a=>a.inicio&&a.entrega);
  if(!acts.length)return `<div class="board"><div style="padding:20px;color:var(--txt3)">Agrega fechas de inicio y entrega a las actividades para ver el Gantt.</div></div>`;
  const min=new Date(Math.min(...acts.map(a=>+new Date(a.inicio))));
  const max=new Date(Math.max(...acts.map(a=>+new Date(a.entrega))));
  const span=Math.max(1,(max-min)/86400000);
  const pct=dt=>((new Date(dt)-min)/86400000)/span*100;
  const hoy=new Date(new Date().toDateString());
  const hoyPct=(hoy>=min&&hoy<=max)?((hoy-min)/86400000)/span*100:null;
  // etiquetas de mes
  const meses=[];let cur=new Date(min.getFullYear(),min.getMonth(),1);
  while(cur<=max){meses.push(new Date(cur));cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);}
  const mesLbl=meses.map(m=>`<div style="flex:1;font-size:10.5px;color:var(--txt3);border-left:1px solid var(--line);padding-left:6px;font-family:'DM Mono'">${m.toLocaleDateString("es-MX",{month:"short",year:"2-digit"})}</div>`).join("");
  const rows=acts.map((a,i)=>{
    const l=pct(a.inicio),w=Math.max(1.5,pct(a.entrega)-l);
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div style="width:210px;flex-shrink:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="display:inline-block;width:20px;color:var(--txt3);font-family:'DM Mono';font-size:11px">${i+1}.</span>${esc(a.actividad)}</div>
      <div style="flex:1;position:relative;height:22px;background:var(--panel);border-radius:5px">
        ${hoyPct!=null?`<div style="position:absolute;top:-4px;bottom:-4px;left:${hoyPct}%;width:2px;background:var(--s-bloq);z-index:3"></div>`:''}
        <div style="position:absolute;top:3px;height:16px;left:${l}%;width:${w}%;background:${COLOR[a.estado]};border-radius:5px;min-width:6px" title="${a.inicio} → ${a.entrega}"></div>
      </div></div>`;
  }).join("");
  return `<div class="board"><div class="board-head"><span class="gc" style="background:var(--accent)"></span><h3>Gantt</h3>${hoyPct!=null?'<span class="count" style="color:var(--s-bloq)">línea roja = hoy</span>':''}</div>
    <div style="padding:16px 18px">
      <div style="display:flex;gap:10px;margin-bottom:10px"><div style="width:210px;flex-shrink:0"></div><div style="flex:1;display:flex">${mesLbl}</div></div>
      ${rows}
    </div></div>`+leyenda();
}

/* --- SUB: KANBAN --- */
function subKanban(p){
  const cols=ESTADOS.map(e=>{

      <div class="kcard" style="border-top:3px solid ${COLOR[e]}">
        <div class="kt">${esc(a.actividad)}</div>

        <select class="kmove" onchange="updEstado('${a.id}',this.value)">${ESTADOS.map(s=>`<option ${s===e?'selected':''}>${s}</option>`).join("")}</select>

/* --- SUB: CALENDARIO --- */
let CALREF=null;
function calNav(delta){if(!CALREF)CALREF=new Date();CALREF=new Date(CALREF.getFullYear(),CALREF.getMonth()+delta,1);renderProyecto();}
function calHoy(){CALREF=new Date();renderProyecto();}
function subCalendario(p){
  const acts=p.actividades.filter(a=>a.entrega);
  if(!acts.length)return `<div class="board"><div style="padding:20px;color:var(--txt3)">Sin fechas de entrega para mostrar en calendario.</div></div>`;
  if(!CALREF){const base=acts.map(a=>new Date(a.entrega)).sort((a,b)=>a-b);CALREF=base.find(dt=>dt>=new Date(new Date().toDateString()))||base[0];CALREF=new Date(CALREF.getFullYear(),CALREF.getMonth(),1);}
  const y=CALREF.getFullYear(),m=CALREF.getMonth();
  const first=new Date(y,m,1),start=(first.getDay()+6)%7;
  const dias=new Date(y,m+1,0).getDate();
  const dowk=["L","M","M","J","V","S","D"];
  let cells="";
  for(let i=0;i<start;i++)cells+=`<div class="cal-cell empty"></div>`;
  for(let dnum=1;dnum<=dias;dnum++){
    const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(dnum).padStart(2,"0")}`;
    const evs=acts.filter(a=>a.entrega===ds);
    const isHoy=ds===new Date().toISOString().slice(0,10);
    cells+=`<div class="cal-cell${isHoy?' hoy':''}"><div class="cal-d">${dnum}</div>${evs.map(a=>`<div class="cal-ev" style="background:${COLOR[a.estado]}1e;color:var(--txt);border-left:3px solid ${COLOR[a.estado]}">${esc(a.actividad)}</div>`).join("")}</div>`;
  }
  return `<div class="board"><div class="board-head"><span class="gc" style="background:var(--accent)"></span><h3 style="text-transform:capitalize">${CALREF.toLocaleDateString("es-MX",{month:"long",year:"numeric"})}</h3>
      <div style="margin-left:auto;display:flex;gap:6px"><button class="btn-ghost" style="padding:5px 11px" onclick="calNav(-1)">‹</button><button class="btn-ghost" style="padding:5px 11px" onclick="calHoy()">Hoy</button><button class="btn-ghost" style="padding:5px 11px" onclick="calNav(1)">›</button></div></div>
    <div style="padding:14px 16px">
      <div class="cal-grid cal-head">${dowk.map(x=>`<div>${x}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
    </div></div>`+leyenda();
}

/* --- SUB: BITÁCORA (del proyecto) --- */
function subBitacora(p){
  const H=(STATE.hallazgos||[]).filter(h=>h.proyecto===p.nombre);
  const cnt={A:0,B:0,C:0,D:0};H.forEach(h=>{if(cnt[h.fam]!=null)cnt[h.fam]++;});
  const total=H.length||1;
  const arr=Object.entries(cnt).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const max=Math.max(1,...arr.map(a=>a.v));
  let acc=0;const W=680,Hh=230,padL=40,padB=52,padT=22,plot=Hh-padB-padT,bw=(W-padL-40)/arr.length;
  let bars="",dots=[],labels="";
  arr.forEach((a,i)=>{const x=padL+i*bw,cx=x+bw/2,bh=a.v/max*plot,y=padT+plot-bh;const col=FAMILIAS[a.k].color;
    bars+=`<rect x="${x+bw*0.2}" y="${y}" width="${bw*0.6}" height="${bh}" rx="5" fill="${col}"/><text x="${cx}" y="${y-7}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--txt)">${a.v}</text>`;
    acc+=a.v;const py=padT+plot-(acc/total)*plot;dots.push([cx,py,Math.round(acc/total*100)]);
    labels+=`<text x="${cx}" y="${Hh-padB+18}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--txt)">Fam ${a.k}</text>`;});
  const poly=dots.map(d=>`${d[0]},${d[1]}`).join(" ");
  const dHtml=dots.map(d=>`<circle cx="${d[0]}" cy="${d[1]}" r="4" fill="var(--txt)"/><text x="${d[0]}" y="${d[1]-9}" text-anchor="middle" font-size="10" fill="var(--txt)">${d[2]}%</text>`).join("");
  const dom=arr[0];
  const CM=k=>(STATE.contramedidas&&STATE.contramedidas[k])||FAMILIAS[k];
  const Hf=BFILTRO==="todas"?H:H.filter(h=>h.fam===BFILTRO);
  const rows=[...Hf].sort((a,b)=>a.fam.localeCompare(b.fam)).map((h,i)=>`<tr>
    <td class="cellpad mono">${String(i+1).padStart(2,"0")}</td>
    <td class="cellpad"><b>${esc(h.titulo)}</b><div style="font-size:11.5px;color:var(--txt3);margin-top:2px">${esc(h.detalle)}</div><div style="font-size:10.5px;color:var(--txt3);margin-top:2px">${esc(h.resp)}</div></td>
    <td style="text-align:center"><span class="pill" style="background:${FAMILIAS[h.fam].color}22;color:${FAMILIAS[h.fam].color}">${h.fam}</span>${h.recurrente?'<div style="font-size:9px;color:#E2445C;font-family:DM Mono;margin-top:3px">RECURRENTE</div>':''}</td>
    <td class="cellpad"><span class="pill ${h.impacto==='alto'?'r':h.impacto==='medio'?'a':'n'}">${h.impacto}</span></td>
    <td style="text-align:center"><select class="estado" style="background:var(--panel);color:var(--txt);width:calc(100% - 12px)" onchange="updHallazgo('${h.id}',this.value)">${["abierto","por corregir","en curso","corregido","resuelto","cerrado"].map(s=>`<option ${s===h.estatus?'selected':''}>${s}</option>`).join("")}</select></td>
  </tr>`).join("");
  const filtros=`<div class="famfilt">${[["todas","Todas"],["A","A"],["B","B"],["C","C"],["D","D"]].map(([k,l])=>`<button class="${BFILTRO===k?'on':''}" style="${k!=='todas'&&BFILTRO===k?`background:${FAMILIAS[k].color};border-color:${FAMILIAS[k].color};color:#fff`:''}" onclick="setBFiltro('${k}')">${l}${k!=='todas'?` · ${cnt[k]}`:''}</button>`).join("")}</div>`;
  const contra=Object.entries(FAMILIAS).map(([k,f])=>{const c=CM(k);return `<div class="board" style="border-top:3px solid ${f.color};margin-bottom:0"><div style="padding:14px 16px"><div style="display:flex;align-items:center;gap:9px;margin-bottom:8px"><span style="width:24px;height:24px;border-radius:6px;background:${f.color};color:#fff;display:grid;place-items:center;font-weight:700;font-family:DM Mono">${k}</span><b style="font-size:12.5px">Familia ${k} · ${cnt[k]}</b><button class="btn-ghost" style="margin-left:auto;padding:3px 10px;font-size:11px" onclick="modalEditarContra('${k}')">Editar</button></div><div style="font-size:12px;color:var(--txt2);line-height:1.5">${esc(c.contra)}</div><div style="font-size:11px;color:var(--txt3);margin-top:8px;padding-top:7px;border-top:1px solid var(--line)">Dueño: <b style="color:var(--accent)">${esc(c.dueno)}</b></div></div></div>`}).join("");
  const pareto=H.length?`<div class="board"><div class="board-head"><span class="gc" style="background:#E2445C"></span><h3>Pareto por familia</h3></div><div style="padding:12px 18px"><svg viewBox="0 0 ${W} ${Hh}" style="width:100%;max-width:600px"><line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plot}" stroke="var(--line)"/><line x1="${padL}" y1="${padT+plot}" x2="${W-40}" y2="${padT+plot}" stroke="var(--line)"/>${bars}<polyline points="${poly}" fill="none" stroke="var(--txt)" stroke-width="2"/>${dHtml}${labels}</svg><p class="note">La <b>Familia ${dom.k} (${FAMILIAS[dom.k].nombre})</b> es la que más se repite en este proyecto.</p></div></div>`:"";
  return `<div class="board" style="border:none;box-shadow:none;background:transparent;margin-bottom:8px"><p class="sub" style="margin:0">Hallazgos de este proyecto, clasificados por causa raíz. Registra lo que salió mal para no repetirlo.</p></div>
    ${pareto}
    <div class="board"><div class="board-head"><span class="gc" style="background:var(--accent)"></span><h3>Registro de hallazgos</h3><span class="count">${Hf.length}${BFILTRO!=='todas'?' de '+H.length:''}</span><div style="margin-left:auto">${filtros}</div></div>
      <table class="tbl"><thead><tr><th>#</th><th>Hallazgo</th><th style="text-align:center">Familia</th><th>Impacto</th><th style="text-align:center;width:130px">Estatus</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="cellpad" style="color:var(--txt3)">Sin hallazgos en este filtro.</td></tr>'}</tbody></table>
      <div class="addrow" onclick="modalNuevoHallazgoProy('${p.id}')">+ Registrar hallazgo</div></div>
    <div style="font-size:13px;font-weight:700;margin:6px 0 10px">Contramedidas replicables</div><div class="dashgrid" style="grid-template-columns:repeat(2,1fr)">${contra}</div>`;
}
function setBFiltro(f){BFILTRO=f;renderProyecto();}
function modalEditarContra(k){
  const c=(STATE.contramedidas&&STATE.contramedidas[k])||FAMILIAS[k];

/* --- SUB: DASHBOARD DEL PROYECTO --- */
function subDashboard(p){
  const av=avanceProy(p);
  const porEst={};ESTADOS.forEach(e=>porEst[e]=p.actividades.filter(a=>a.estado===e).length);
  const maxEst=Math.max(1,...Object.values(porEst));
  const vc=vencidas(p),prox=proxHitos(p,3);
  // carga por responsable (avance promedio)
  const resp={};p.actividades.forEach(a=>{(resp[a.resp]=resp[a.resp]||[]).push(a.avance);});
  const carga=Object.entries(resp).map(([r,arr])=>({r,pct:Math.round(arr.reduce((x,y)=>x+y,0)/arr.length)})).sort((a,b)=>b.pct-a.pct);
  // donut
  const R=52,C=2*Math.PI*R,off=C*(1-av/100);
  const donut=`<svg viewBox="0 0 130 130" style="width:150px;height:150px"><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--panel)" stroke-width="14"/><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--s-term)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"/><text x="65" y="72" text-anchor="middle" font-size="26" font-weight="700" fill="var(--txt)">${av}%</text></svg>`;
  const barsEst=ESTADOS.map(e=>`<div style="text-align:center;flex:1"><div style="height:90px;display:flex;align-items:flex-end;justify-content:center"><div style="width:56%;height:${porEst[e]/maxEst*100}%;background:${COLOR[e]};border-radius:5px 5px 0 0;min-height:3px;position:relative"><span style="position:absolute;top:-18px;left:0;right:0;font-size:12px;font-weight:700">${porEst[e]}</span></div></div><div style="font-size:9px;color:var(--txt3);margin-top:5px;line-height:1.15;min-height:22px">${e}</div></div>`).join("");
  const cargaHtml=carga.map(c=>`<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px"><span class="person" style="width:130px;flex-shrink:0">${ava(c.r)}<span style="font-size:11.5px">${esc(c.r)}</span></span><div class="avbar" style="flex:1"><div class="avfill" style="width:${c.pct}%;background:${c.pct>=60?'var(--s-term)':'var(--s-proc)'}"></div></div><span class="avnum">${c.pct}%</span></div>`).join("");
  return `<div class="dashgrid">
    <div class="board"><div class="board-head"><h3>Avance general</h3></div><div style="padding:18px;display:flex;justify-content:center">${donut}</div></div>
    <div class="board"><div class="board-head"><h3>Actividades por estado</h3></div><div style="padding:22px 18px 14px;display:flex;gap:6px">${barsEst}</div></div>
    <div class="board"><div class="board-head"><h3>Actividades vencidas</h3></div><div style="padding:18px;text-align:center"><div style="font-size:46px;font-weight:700;color:${vc.length?'var(--s-bloq)':'var(--s-term)'}">${vc.length}</div><div style="font-size:12px;color:var(--txt3)">${vc.length?'requieren atención':'¡Buen trabajo!'}</div></div></div>
    <div class="board"><div class="board-head"><h3>Próximas entregas</h3></div><div style="padding:14px 18px">${prox.length?prox.map((a,i)=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)"><span>${i+1}. ${esc(a.actividad)}</span><span class="mono" style="color:var(--txt3)">${a.entrega||"—"}</span></div>`).join(""):'<div style="color:var(--txt3);font-size:12px">Sin pendientes.</div>'}</div></div>
    <div class="board" style="grid-column:1/-1"><div class="board-head"><h3>Carga de trabajo por responsable</h3></div><div style="padding:16px 18px">${cargaHtml}</div></div>
    ${(()=>{const rs=(p.riesgos||[]).filter(r=>r.estatus!=="cerrado").sort((a,b)=>nivelRiesgo(b)-nivelRiesgo(a));if(!rs.length)return "";return `<div class="board" style="grid-column:1/-1"><div class="board-head"><span class="gc" style="background:#E2445C"></span><h3>Riesgos principales</h3><span class="count">${rs.length}</span></div><div style="padding:12px 18px">${rs.map(r=>{const n=nivelRiesgo(r);return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(r.desc)} <span style="color:var(--txt3)">· ${esc(r.resp)}</span></span><span class="pill" style="background:${nivelColor(n)};color:#fff">${nivelTxt(n)}</span></div>`}).join("")}</div></div>`;})()}
  </div>`;
}

function nivelColor(n){return n>=15?"#E2445C":n>=8?"#FDAB3D":n>=4?"#FFCB00":"#00C875";}

      matriz+=`<td style="width:38px;height:34px;text-align:center;background:${nivelColor(n)};opacity:${cnt?1:.28};color:#fff;font-weight:700;border:2px solid #fff;border-radius:4px">${cnt||''}</td>`;}

    <div class="h1">Tablero de Riesgos</div>
    <p class="sub">Todos los riesgos del portafolio, ordenados por nivel = Probabilidad × Impacto (1–5 cada uno). Los críticos van arriba: ahí pones tu energía.</p>

    </div>

}

/* ===== BITÁCORA DE HALLAZGOS (portafolio + Pareto) ===== */
function renderBitacora(){
  const H=STATE.hallazgos||[];
  const cnt={A:0,B:0,C:0,D:0};H.forEach(h=>{if(cnt[h.fam]!=null)cnt[h.fam]++;});
  const total=H.length||1;
  const arr=Object.entries(cnt).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const max=Math.max(1,...arr.map(a=>a.v));
  let acc=0;const W=680,Hh=250,padL=40,padB=54,padT=24,plot=Hh-padB-padT,bw=(W-padL-40)/arr.length;
  let bars="",dots=[],labels="";
  arr.forEach((a,i)=>{const x=padL+i*bw,cx=x+bw/2,bh=a.v/max*plot,y=padT+plot-bh;const col=FAMILIAS[a.k].color;
    bars+=`<rect x="${x+bw*0.2}" y="${y}" width="${bw*0.6}" height="${bh}" rx="5" fill="${col}"/><text x="${cx}" y="${y-7}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--txt)">${a.v}</text>`;
    acc+=a.v;const py=padT+plot-(acc/total)*plot;dots.push([cx,py,Math.round(acc/total*100)]);
    labels+=`<text x="${cx}" y="${Hh-padB+18}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--txt)">Fam ${a.k}</text>`;});
  const poly=dots.map(d=>`${d[0]},${d[1]}`).join(" ");
  const dHtml=dots.map(d=>`<circle cx="${d[0]}" cy="${d[1]}" r="4" fill="var(--txt)"/><text x="${d[0]}" y="${d[1]-9}" text-anchor="middle" font-size="10" fill="var(--txt)">${d[2]}%</text>`).join("");
  const dom=arr[0];
  const rows=[...H].sort((a,b)=>a.fam.localeCompare(b.fam)).map((h,i)=>`<tr>
    <td class="cellpad mono">${String(i+1).padStart(2,"0")}</td>
    <td class="cellpad"><b>${esc(h.titulo)}</b><div style="font-size:11.5px;color:var(--txt3);margin-top:2px">${esc(h.detalle)}</div><div style="font-size:10.5px;color:var(--txt3);margin-top:2px">${esc(h.proyecto)} · ${esc(h.resp)}</div></td>
    <td style="text-align:center"><span class="pill" style="background:${FAMILIAS[h.fam].color}22;color:${FAMILIAS[h.fam].color}">${h.fam}</span>${h.recurrente?'<div style="font-size:9px;color:#E2445C;font-family:DM Mono;margin-top:3px">RECURRENTE</div>':''}</td>
    <td class="cellpad"><span class="pill ${h.impacto==='alto'?'r':h.impacto==='medio'?'a':'n'}">${h.impacto}</span></td>
    <td style="text-align:center"><select class="estado" style="color:var(--txt);font-weight:600" onchange="updHallazgo('${h.id}',this.value)">${["abierto","por corregir","en curso","corregido","resuelto","cerrado"].map(s=>`<option ${s===h.estatus?'selected':''}>${s}</option>`).join("")}</select></td>
  </tr>`).join("");
  const contra=Object.entries(FAMILIAS).map(([k,f])=>`<div class="board" style="border-top:3px solid ${f.color};margin-bottom:0">
    <div style="padding:14px 16px"><div style="display:flex;align-items:center;gap:9px;margin-bottom:8px"><span style="width:26px;height:26px;border-radius:7px;background:${f.color};color:#fff;display:grid;place-items:center;font-weight:700;font-family:DM Mono">${k}</span><b style="font-size:13px">Familia ${k} · ${cnt[k]} caso(s)</b></div>
    <div style="font-size:12.5px;color:var(--txt2);line-height:1.5">${esc(f.contra)}</div>
    <div style="font-size:11px;color:var(--txt3);margin-top:9px;padding-top:8px;border-top:1px solid var(--line)">Dueño: <b style="color:var(--accent)">${esc(f.dueno)}</b></div></div></div>`).join("");
  $("#v-bitacora").innerHTML=`
    <div class="eyebrow">Aprendizaje · Directiva Fernando</div>
    <div class="h1">Bitácora de Hallazgos</div>
    <p class="sub">Los hallazgos de todos los proyectos, clasificados por familia de causa raíz. Sirven para aprender: atacas la familia que más se repite con una sola contramedida, y no vuelve a pasar en el siguiente proyecto.</p>
    <div class="strip">
      <div class="chip"><div class="k">Hallazgos</div><div class="v">${H.length}</div></div>
      <div class="chip"><div class="k">Familia dominante</div><div class="v" style="color:#E2445C">${Math.round(dom.v/total*100)}%</div></div>
      <div class="chip"><div class="k">Abiertos</div><div class="v" style="color:#FDAB3D">${H.filter(h=>['abierto','por corregir','en curso'].includes(h.estatus)).length}</div></div>
      <div class="chip"><div class="k">Contramedidas</div><div class="v" style="color:#00C875">4</div></div>
    </div>
    <div class="board"><div class="board-head"><span class="gc" style="background:#E2445C"></span><h3>Pareto por familia</h3></div>
      <div style="padding:12px 18px"><svg viewBox="0 0 ${W} ${Hh}" style="width:100%;max-width:640px"><line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plot}" stroke="var(--line)"/><line x1="${padL}" y1="${padT+plot}" x2="${W-40}" y2="${padT+plot}" stroke="var(--line)"/>${bars}<polyline points="${poly}" fill="none" stroke="var(--txt)" stroke-width="2"/>${dHtml}${labels}</svg>
      <p class="note">La <b>Familia ${dom.k} (${FAMILIAS[dom.k].nombre})</b> concentra ${dom.v} de ${H.length} hallazgos. Una sola contramedida en el intake desactiva la mayor parte del problema — para todos los proyectos.</p></div></div>
    <div class="board"><div class="board-head"><span class="gc" style="background:var(--accent)"></span><h3>Registro de hallazgos</h3><span class="count">${H.length}</span></div>
      <table class="tbl"><thead><tr><th>#</th><th>Hallazgo</th><th style="text-align:center">Familia</th><th>Impacto</th><th style="text-align:center;width:140px">Estatus</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="addrow" onclick="modalNuevoHallazgo()">+ Registrar hallazgo</div></div>
    <div style="font-size:13px;font-weight:700;margin:6px 0 10px">Contramedidas replicables</div>
    <div class="dashgrid" style="grid-template-columns:repeat(2,1fr)">${contra}</div>`;
}

  $("#v-solicitudes").innerHTML=`
    <div class="eyebrow">Recibir solicitudes</div>
    <div class="h1">Solicitudes</div>
    <p class="sub">Peticiones que llegan de otras áreas (nuevos proyectos, cambios, urgencias). Aquí las registras para que nada se pierda en el chat o el correo.</p>
    <div class="board"><div class="board-head"><span class="gc" style="background:var(--accent)"></span><h3>Bandeja de solicitudes</h3><span class="count">${STATE.solicitudes.length}</span></div>
      <table class="tbl"><thead><tr><th>Solicitud</th><th>De</th><th>Fecha</th><th style="text-align:center;width:110px">Estatus</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="cellpad" style="color:var(--txt3)">Sin solicitudes. Usa el botón para registrar una.</td></tr>'}</tbody></table>
      <div class="addrow" onclick="modalNuevaSolicitud()">+ Registrar solicitud</div></div>`;
}
function modalNuevaSolicitud(){
  openModal(`<h3>Nueva solicitud</h3>
   <label>Título</label><input id="s_t" placeholder="¿Qué se solicita?">
   <label>Descripción</label><input id="s_d" placeholder="Detalle">
   <label>De (área/persona)</label><input id="s_de" placeholder="Quién la pide">
   <div class="actions"><button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="guardarSolicitud()">Guardar</button></div>`);
}
function guardarSolicitud(){
  const t=$("#s_t").value.trim();if(!t){alert("Escribe el título");return;}
  if(!STATE.solicitudes)STATE.solicitudes=[];
  STATE.solicitudes.push({id:"s"+Date.now(),titulo:t,desc:$("#s_d").value,de:$("#s_de").value||"—",fecha:new Date().toISOString().slice(0,10),estatus:"pendiente"});
  save();closeModal();renderSolicitudes();
}

/* ===== IMPORTAR / EXPORTAR (JSON estándar) ===== */
function modalImportar(){
  openModal(`<h3>Importar / Exportar datos</h3>
   <p style="font-size:12.5px;color:var(--txt2);margin-bottom:10px">Pega el JSON estandarizado (el que te devuelve el análisis del chat) y presiona <b>Importar</b>. O usa <b>Exportar</b> para copiar el estado actual y mandármelo a analizar.</p>
   <textarea id="imp_txt" style="width:100%;height:170px;font-family:'DM Mono';font-size:11px;border:1px solid var(--line);border-radius:8px;padding:10px" placeholder='{"proyecto":"...","actividades":[...]}'></textarea>
   <div class="actions"><button class="btn-ghost" onclick="exportarJSON()">⬇ Exportar (copiar)</button><button class="btn" onclick="importarJSON()">⬆ Importar</button></div>
   <p style="font-size:11px;color:var(--txt3);margin-top:10px">Importar reemplaza proyectos con el mismo id y agrega los nuevos. Hallazgos también se fusionan.</p>`);
}
function exportarJSON(){const t=$("#imp_txt");t.value=JSON.stringify({proyectos:STATE.proyectos,hallazgos:STATE.hallazgos},null,2);t.select();try{document.execCommand("copy");}catch(e){}alert("Estado copiado al cuadro. Cópialo y pégamelo en el chat.");}
function importarJSON(){
  let data;try{data=JSON.parse($("#imp_txt").value);}catch(e){alert("El JSON no es válido.");return;}
  let n=0;
  if(Array.isArray(data.proyectos))data.proyectos.forEach(np=>{const i=STATE.proyectos.findIndex(p=>p.id===np.id);if(i>=0)STATE.proyectos[i]=np;else STATE.proyectos.push(np);n++;});
  else if(data.proyecto&&Array.isArray(data.actividades)){let p=STATE.proyectos.find(x=>x.nombre===data.proyecto);
    if(!p){p={id:"p"+Date.now(),nombre:data.proyecto,cliente:data.cliente||"",valor:data.valor||0,inauguracion:data.inauguracion||"",actividades:[],riesgos:[]};STATE.proyectos.push(p);}
    data.actividades.forEach(a=>p.actividades.push(act(a.fase||"Planeación",a.actividad,a.responsable||a.resp||"Por definir",a.inicio||"",a.entrega||"",a.estado||"No iniciado",a.prioridad)));n++;}
  if(Array.isArray(data.hallazgos)){if(!STATE.hallazgos)STATE.hallazgos=[];data.hallazgos.forEach(h=>{const i=STATE.hallazgos.findIndex(x=>x.id===h.id);if(i>=0)STATE.hallazgos[i]=h;else STATE.hallazgos.push(h);});}
  save();closeModal();setV("maestro");alert("Importado. Se actualizaron "+n+" proyecto(s).");
}

normaliza();
renderSidebar();
renderMaestro();
bootFirebase();
</script>
</body>
</html>
