<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Proyectos Especiales · Línea Italia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FB; --card:#FFFFFF; --navy:#0F1535; --navy2:#1A2149;
  --accent:#2563EB; --txt:#1C1F3B; --txt2:#5A6080; --txt3:#9096B0;
  --line:#E6E9F2; --panel:#F1F3FA;
  /* estados monday */
  --s-noini:#C4C4C4; --s-listo:#579BFC; --s-proc:#FDAB3D; --s-rev:#A25DDC; --s-bloq:#E2445C; --s-term:#00C875;
  --shadow:0 1px 4px rgba(15,21,53,.07); --shadow-lg:0 12px 32px rgba(15,21,53,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:70px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.mono{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{height:10px;width:10px}::-webkit-scrollbar-thumb{background:#D4D9E8;border-radius:6px}

.app{display:flex;min-height:100vh}
.side{width:240px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2563EB,#60A5FA);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.side-brand b{font-size:14px;font-weight:700;display:block;line-height:1.1}
.side-brand span{color:var(--txt3);font-size:10px;font-family:'DM Mono';text-transform:uppercase;letter-spacing:.1em}
.side-sec{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.1em;font-family:'DM Mono';padding:6px 10px 4px}
.side-ws{font-size:13px;font-weight:700;padding:4px 10px 10px;display:flex;align-items:center;gap:7px}
.side-ws::before{content:"M";width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,#7C3AED,#A25DDC);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav button{text-align:left;font-size:13px;font-weight:500;color:var(--txt2);padding:8px 10px 8px 16px;border-radius:8px;display:flex;align-items:center;gap:8px}
.side-nav button:hover{background:var(--panel)}
.side-nav button.on{background:var(--accentSoft,#E9F0FE);color:var(--accent);font-weight:600}
.side-nav .ico{width:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--txt3)}
.side-nav button.on .ico{color:var(--accent)}
.side-nav .proj{padding-left:26px;font-size:12.5px}
.side-nav .subhead{font-size:9.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.09em;font-family:'DM Mono';padding:10px 10px 3px}
.side-imp{text-align:left;font-size:12px;font-weight:600;color:var(--accent);padding:9px 12px;border-radius:8px;border:1px solid var(--line);margin-top:8px}
.side-imp:hover{background:var(--panel)}
.main{flex:1;min-width:0;padding:26px 34px 60px;max-width:1680px}
.famfilt{display:flex;gap:5px}
.famfilt button{font-size:11px;font-weight:600;color:var(--txt2);padding:4px 11px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.famfilt button:hover{border-color:var(--accent);color:var(--accent)}
.famfilt button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:820px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:4px}.side-nav{flex-direction:row;flex-wrap:wrap}.main{padding:16px}}
.view{display:none}.view.on{display:block}
.eyebrow{font-family:'DM Mono';font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.h1{font-size:25px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--txt2);font-size:14px;margin-top:7px;max-width:80ch;line-height:1.5}

/* resumen strip */
.strip{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 16px;box-shadow:var(--shadow);flex:1;min-width:150px}
.chip .k{font-size:11px;color:var(--txt3)}.chip .v{font-size:21px;font-weight:700;margin-top:3px}

/* BOARD */
.board{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.board-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.board-head .gc{width:6px;height:22px;border-radius:3px}
.board-head h3{font-size:15px;font-weight:700}
.board-head .count{font-size:12px;color:var(--txt3);margin-left:2px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:8px 12px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3);font-weight:600;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl.fixed{table-layout:fixed}
.tbl.fixed td{overflow:hidden}
.tbl.fixed .actv{word-break:break-word;display:block}
.actv-edit{cursor:pointer;border-radius:5px;transition:.12s}
.actv-edit:hover{color:var(--accent);text-decoration:underline}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover{background:#FBFCFE}
.cellpad{padding:6px 12px}
.grpbar{width:11px;padding:0!important;text-align:center;vertical-align:middle}
.gbar{display:inline-block;width:4px;height:20px;border-radius:4px;vertical-align:middle}
.actv{font-weight:600;color:var(--txt);font-size:12.5px}
.fase-lbl{font-size:11px;color:var(--txt3)}

/* persona chip */
.person{display:inline-flex;align-items:center;gap:7px}
.ava{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}

/* estado / prioridad: pastilla compacta con aire alrededor */
.estado{display:block;margin:5px 10px;height:26px;line-height:26px;border:none;color:#fff;font-weight:600;font-size:11.5px;text-align:center;cursor:pointer;-webkit-appearance:none;appearance:none;text-align-last:center;border-radius:6px;width:calc(100% - 20px);padding:0 6px}
.estado option{color:#1C1F3B;background:#fff}

/* avance */
.avance{display:flex;align-items:center;gap:8px;padding:7px 12px}
.avbar{flex:1;height:8px;background:var(--panel);border-radius:6px;overflow:hidden;min-width:54px}
.avfill{height:100%;border-radius:6px;background:var(--s-term)}
.avnum{font-size:11px;color:var(--txt2);font-family:'DM Mono';width:32px;text-align:right}

.datecell input{border:1px solid transparent;background:transparent;font-family:'DM Mono';font-size:11.5px;color:var(--txt2);padding:6px 8px;width:112px;border-radius:6px}
.datecell input:hover{border-color:var(--line);background:#fff}

.legend{display:flex;gap:9px;flex-wrap:wrap;margin:6px 0 18px}
.legend .l{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt2);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 11px}
.legend .sw{width:11px;height:11px;border-radius:3px}

.btn{background:var(--accent);color:#fff;font-weight:600;font-size:13px;padding:8px 15px;border-radius:9px}
.btn:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--card);color:var(--txt2);border:1px solid var(--line);font-weight:600;font-size:13px;padding:8px 15px;border-radius:9px}
.addrow{padding:11px 18px;color:var(--txt3);font-size:13px;font-weight:600;cursor:pointer;border-top:1px dashed var(--line)}
.addrow:hover{color:var(--accent);background:#FBFCFE}

/* master board rows */
.mrow{cursor:pointer}
.mname{font-weight:700;font-size:14px;line-height:1.35}.mcli{font-size:11.5px;color:var(--txt3);line-height:1.3;margin-top:1px}
.delbtn{width:24px;height:24px;border-radius:6px;color:var(--txt3);font-size:12px;opacity:0;transition:.15s}
.mrow:hover .delbtn{opacity:1}
.delbtn:hover{background:var(--s-bloq);color:#fff}
.tbl .mrow td{padding-top:2px;padding-bottom:2px}
.tbl .airow td{padding-top:5px;padding-bottom:5px}
.tbl .airow .cellpad{padding-top:12px;padding-bottom:12px}

.back{color:var(--accent);font-size:13px;font-weight:600;margin-bottom:14px;display:inline-flex;gap:5px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,21,53,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:480px;width:100%;box-shadow:var(--shadow-lg)}
.modal h3{font-size:17px;font-weight:700;margin-bottom:14px}
.modal label{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin:10px 0 4px}
.modal input,.modal select{width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
/* Fase 2: dialogos largos con scroll, variante ancha y hoja inferior en celular */
.modal{max-height:calc(100vh - 40px);overflow-y:auto}
.modal.wide{max-width:760px}
.modal textarea{width:100%;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:9px;resize:vertical}
.rd-sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:16px 0 4px;display:flex;align-items:center;gap:8px}
.rd-sec .hint{font-weight:500;letter-spacing:0;text-transform:none;color:var(--txt3);font-size:11px}
.rd-row{display:grid;grid-template-columns:1fr 150px 90px 28px;gap:6px;margin-bottom:6px;align-items:center}
.rd-row.pd{grid-template-columns:1fr 180px 28px}
.rd-row button{color:var(--txt3);font-size:14px}
.rd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rd-add{font-size:12px;font-weight:600;color:var(--accent);padding:4px 0}
.rd-meta{font-size:11px;color:var(--txt3)}
@media(max-width:600px){
  .modal-bg{padding:0;align-items:flex-end}
  .modal{border-radius:16px 16px 0 0;max-height:94vh;padding:18px}
  .rd-grid{grid-template-columns:1fr 1fr}
  .rd-row{grid-template-columns:1fr 1fr 28px}.rd-row input{grid-column:1 / -1}
  .rd-row.pd{grid-template-columns:1fr 28px}.rd-row.pd input:nth-child(2){grid-column:1}
}
.foot{text-align:center;color:var(--txt3);font-size:11px;margin-top:26px;font-family:'DM Mono'}
.ptabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:16px 0 18px}
.ptabs button{font-size:13px;font-weight:600;color:var(--txt2);padding:9px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button:hover{color:var(--txt)}
.ptabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.kanban{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.kcol{background:var(--panel);border-radius:11px;padding:10px;min-height:90px}
.kcol h4{font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-family:'DM Mono';margin-bottom:9px;font-weight:700}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;box-shadow:var(--shadow)}
.kcard .kt{font-size:12px;font-weight:600;line-height:1.3;margin-bottom:6px}
.kcard .km{display:flex;align-items:center;justify-content:space-between;gap:6px}
.kcard .kmove{width:100%;font-size:10px;padding:3px 5px;margin-top:7px;border:1px solid var(--line);border-radius:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-head div{text-align:center;font-size:10.5px;color:var(--txt3);font-weight:700;font-family:'DM Mono';padding-bottom:4px}
.cal-cell{min-height:88px;background:var(--panel);border-radius:8px;padding:6px 7px}
.cal-cell.empty{background:transparent}
.cal-cell.hoy{outline:2px solid var(--accent)}
.cal-d{font-size:11px;color:var(--txt3);font-weight:600;margin-bottom:3px}
.cal-ev{font-size:10.5px;line-height:1.3;padding:3px 5px;border-radius:4px;margin-bottom:3px;overflow:hidden}
.dashgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dashgrid .board{margin-bottom:0}
@media(max-width:800px){.kanban{grid-template-columns:1fr 1fr}.dashgrid{grid-template-columns:1fr}}
@media(max-width:800px){.tbl{font-size:12.5px}.wrap{padding:16px}}
</style>
</head>

   {id:"i6",fecha:"2026-08-07",tipo:"Resumen del día",avance:null,titulo:"Llegó la tela · propuesta de liberar con rodaja de 60 mm",

     VISTO_TS      — sello del estado que esta pestana cargo o escribio por ultima vez
     MI_ULTIMO_TS  — para reconocer el eco de mis propias escrituras en el listener
     PEND_REMOTO   — cambio remoto en espera mientras haya un dialogo abierto          */
let VISTO_TS=0, MI_ULTIMO_TS=0, PEND_REMOTO=null;
/* Cambios sin subir (sep 2026). Sin conexion, Firebase no rechaza la escritura: la deja en
   espera, y si se recarga la pagina se pierde; al arrancar "la nube manda" y lo local se
   descartaba en silencio. Ahora cada guardado marca "pendiente" y solo la confirmacion de
   la nube la quita. Al arrancar o reconectar, si hay pendiente, se decide sin perder nada. */
const KEY_PEND=KEY+"_pendiente";
let CONECTADO=true;       // lo actualiza .info/connected
const MIS_TS=new Set();   // sellos que escribio esta pestana: su eco no es "cambio de otro"
function miTs(ts){MIS_TS.add(ts);if(MIS_TS.size>50)MIS_TS.delete(MIS_TS.values().next().value);}
function hayPendiente(){try{return localStorage.getItem(KEY_PEND)==="1";}catch(e){return false;}}
function marcarPendiente(si){try{si?localStorage.setItem(KEY_PEND,"1"):localStorage.removeItem(KEY_PEND);}catch(e){Falla.registrar('marcar pendiente',e);}}
const fechaHora=ts=>ts?new Date(ts).toLocaleString("es-MX",{dateStyle:"medium",timeStyle:"short"}):"—";
let STATE=localLoad(); let CUR=null; let SUB="tabla"; let BFILTRO="todas"; let VERCERR=false;
function localLoad(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){Falla.registrar('localLoad',e);}return JSON.parse(JSON.stringify(SEED));}
function normaliza(){
  if(!STATE.proyectos)STATE.proyectos=[];
  STATE.proyectos.forEach(p=>{
    p.actividades=p.actividades||[];p.riesgos=p.riesgos||[];p.informes=p.informes||[];
    if(!p.concentrado)p.concentrado={fuente:"",areas:[],conceptos:[]};
    p.concentrado.areas=p.concentrado.areas||[];p.concentrado.conceptos=p.concentrado.conceptos||[];
  });
  if(!STATE.hallazgos)STATE.hallazgos=[];
  if(!STATE.solicitudes)STATE.solicitudes=[];
  if(!STATE.contramedidas)STATE.contramedidas={};
  Object.entries(FAMILIAS).forEach(([k,f])=>{if(!STATE.contramedidas[k])STATE.contramedidas[k]={contra:f.contra,dueno:f.dueno};});
  STATE.hallazgos.forEach(h=>{h.deteccion=h.deteccion||"";h.accion=h.accion||"";h.leccion=h.leccion||"";});
  migra();
}
/* Migración de esquema: sube el estado guardado (local o nube) al esquema actual
   SIN borrar lo que el usuario haya editado. Solo agrega lo que falta. */
function migra(){
  const dest=Number(SEED.schema||1);
  if(Number(STATE.schema||0)>=dest)return;
  // Copia del estado tal como estaba antes de migrar, por si algo sale mal.
  try{localStorage.setItem(KEY+"_premigra",JSON.stringify(STATE));}catch(e){Falla.registrar('respaldo previo a migrar',e);}
  SEED.proyectos.forEach(sp=>{
    const p=STATE.proyectos.find(x=>x.id===sp.id);
    if(!p)return;
    if(sp.concentrado&&!p.concentrado.conceptos.length&&!p.concentrado.areas.length)
      p.concentrado=JSON.parse(JSON.stringify(sp.concentrado));
    if(sp.informes&&sp.informes.length&&!p.informes.length)
      p.informes=JSON.parse(JSON.stringify(sp.informes));
    if(sp.corte&&!p.corte)p.corte=sp.corte;
    // Antes aqui se reemplazaban actividades y riesgos de segmty con la semilla: borraba lo capturado.
  });
  (SEED.hallazgos||[]).forEach(sh=>{
    if((STATE.hallazgosBorrados||[]).includes(sh.id))return;   // lo borro el usuario: no resembrar
    const ex=STATE.hallazgos.find(h=>h.id===sh.id);
    if(!ex)STATE.hallazgos.push(JSON.parse(JSON.stringify(sh)));
    else{["deteccion","accion","leccion"].forEach(k=>{if(!ex[k])ex[k]=sh[k]||"";});}
  });
  STATE.schema=dest;
}
function save(){
  STATE._ts=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(STATE));}catch(e){Falla.critica('guardar tus tareas y proyectos',e);}
  marcarPendiente(true);                 // se quita solo cuando la nube confirma
  if(!(DBREF&&FBLISTO)){setSync("sin conexión — guardado en este equipo, pendiente de subir",true);return;}
  const mio=STATE._ts;
  MI_ULTIMO_TS=mio; miTs(mio);           // el listener ve el eco local antes de la confirmacion
  setSync(CONECTADO?"guardando…":"sin conexión — guardado en este equipo, pendiente de subir",!CONECTADO);
  // Transaccion en vez de set(): Firebase nos entrega lo que hay en la nube y solo
  // escribe si devolvemos algo. Si lo remoto es mas nuevo que lo que cargamos,
  // devolvemos undefined y la escritura se aborta en lugar de pisar el trabajo ajeno.
  DBREF.transaction(remoto=>{
    if(remoto&&remoto._ts&&remoto._ts>VISTO_TS&&!MIS_TS.has(remoto._ts))return;   // abortar (salvo que lo nuevo sea mio)
    return STATE;
  }).then(res=>{
    if(!res.committed){
      setSync("otra sesión guardó algo más nuevo — recargando",true);
      // Lo mio no entra a la nube: bajarlo a archivo antes de reemplazarlo por lo remoto.
      const bajado=descargarRespaldo("mis-cambios-no-subidos");
      return DBREF.once('value').then(s=>{
        const v=s.val();
        if(v)aplicarRemoto(v);
        marcarPendiente(false);
        alert("Otra pestaña o equipo guardó cambios más recientes.\n\nSe cargó lo último para no borrarlos. Vuelve a aplicar tu cambio."+(bajado?"\n\nTu versión quedó en un respaldo descargado por si la necesitas.":""));
      });
    }
    VISTO_TS=mio; MI_ULTIMO_TS=mio;
    if(STATE._ts===mio)marcarPendiente(false);   // si hubo otro guardado despues, sigue pendiente
    setSync("guardado en la nube");
  }).catch(()=>setSync("sin conexión — guardado en este equipo, pendiente de subir",true));
}
// Adopta un estado que llego de otra sesion y repinta la vista en curso.
function aplicarRemoto(v){
  STATE=v; normaliza(); VISTO_TS=v._ts||0;
  try{localStorage.setItem(KEY,JSON.stringify(STATE));}catch(e){Falla.critica('aplicar los cambios de otra sesión',e);}
  // El proyecto abierto pudo haberse borrado en la otra sesion.
  if(VACT==="proyecto"&&!proy(CUR)){setV("maestro");}
  else{setV(VACT||"maestro");}
  setSync("actualizado desde otra sesión");
}
// Escucha continua: antes solo se leia una vez al arrancar, asi que una pestana vieja
// trabajaba a ciegas por horas. Ahora se entera al momento.
function escucharRemoto(){
  DBREF.on('value',snap=>{
    const v=snap.val();
    if(!v||!v._ts)return;
    if(v._ts===MI_ULTIMO_TS||MIS_TS.has(v._ts))return;    // eco de mi propia escritura
    if(v._ts<=VISTO_TS)return;         // nada mas nuevo que lo que ya tengo
    // Llega algo mas nuevo de otra sesion y yo tengo cambios sin subir: conflicto real.
    // Se guarda lo mio en archivo antes de adoptar lo remoto.
    if(hayPendiente()&&STATE._ts&&STATE._ts!==v._ts){
      descargarRespaldo("cambios-locales-en-conflicto");
      marcarPendiente(false);
      setTimeout(()=>alert("Tenías cambios sin subir y otra sesión guardó algo más reciente.\n\nSe cargó la versión de la nube y tus cambios quedaron en un respaldo descargado para que los revises."),50);
    }
    // No interrumpir a media captura: si hay un dialogo abierto, esperar a que cierre.
    const bg=document.getElementById("modalBg");
    if(bg&&bg.classList.contains("on")){
      PEND_REMOTO=v;
      setSync("hay cambios nuevos — cierra el diálogo para verlos",true);
      return;
    }
    aplicarRemoto(v);
  },()=>setSync("sin conexión — guardado local",true));
}
function setSync(txt,warn){const el=document.getElementById("syncf");if(el){el.textContent="Firebase: "+txt;el.style.color=warn?"var(--s-bloq)":"var(--s-term)";}}
function resetData(){if(confirm("¿Restaurar datos de ejemplo? Se pierden tus cambios (también en la nube).\n\nAntes se descargará un respaldo de lo actual."))
{if(!descargarRespaldo("antes-de-restaurar"))return;STATE=JSON.parse(JSON.stringify(SEED));normaliza();save();setV('maestro');}}
function bootFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    setSync("autenticando…");
    firebase.auth().signInAnonymously().then(()=>{
      // Entorno (sep 2026): SOLO el host publicado usa produccion. Cualquier otro origen
      // (disco, localhost, data:, un visor, una copia) usa el nodo de pruebas. La lista
      // es blanca a proposito: si el origen no se reconoce, el riesgo es no tocar
      // produccion.
      // El nodo de pruebas va DENTRO de gestor_pm, no en un hermano /_test: las reglas
      // de pm-li-df619 solo autorizan ese subarbol y cualquier ruta fuera responde
      // PERMISSION_DENIED, con lo que la app caeria a "guardado local" sin sincronizar.
      const NODO=(location.hostname==='lineaitalia-nova.github.io')?'state':'_test_state';
      DBREF=firebase.database().ref('gestor_pm/'+NODO);
      setSync("conectando…");
      const LOCAL=STATE;                                // lo que quedo en este equipo
      DBREF.once('value').then(snap=>{
        const v=snap.val();
        const pend=hayPendiente()&&LOCAL&&LOCAL._ts;
        let subirLocal=false;
        if(v&&pend&&LOCAL._ts>(v._ts||0)){
          // Cambios hechos sin conexion, mas nuevos que la nube: preguntar, nunca descartar en silencio.
          if(confirm(`Tienes cambios guardados en este equipo que no llegaron a la nube (último: ${fechaHora(LOCAL._ts)}).\n\nAceptar = subirlos a la nube\nCancelar = descartarlos y usar la versión de la nube (se descargará un respaldo con tus cambios)`)){
            subirLocal=true;
          }else{descargarRespaldo("cambios-locales-descartados");}
        }else if(v&&pend){
          // La nube tiene algo mas reciente de otra sesion: se adopta, pero lo mio queda en archivo.
          descargarRespaldo("cambios-locales-en-conflicto");
          setTimeout(()=>alert("Tenías cambios sin subir, pero otra sesión guardó algo más reciente en la nube.\n\nSe cargó la versión de la nube y tus cambios quedaron en un respaldo descargado para que los revises."),50);
        }
        if(subirLocal){STATE=LOCAL;normaliza();VISTO_TS=v._ts||0;FBLISTO=true;save();}
        else if(v){STATE=v;normaliza();VISTO_TS=v._ts||0;marcarPendiente(false);}   // la nube manda
        else{normaliza();FBLISTO=true;save();}          // primera vez: sube la semilla
        FBLISTO=true;
        if(!subirLocal)setSync("sincronizado");
        renderSidebar();renderMaestro();
        escucharRemoto();                               // a partir de aqui, en vivo
        // Al recuperar la conexion, subir lo que haya quedado pendiente.
        firebase.database().ref('.info/connected').on('value',c=>{
          CONECTADO=c.val()===true;
          if(CONECTADO){ if(hayPendiente())save(); else setSync("sincronizado"); }
          else setSync("sin conexión — tus cambios se guardan en este equipo",true);
        });
      }).catch(e=>{FBLISTO=false;normaliza();setSync("sin conexión — guardado local",true);});
    }).catch(e=>{FBLISTO=false;normaliza();setSync("error de acceso — guardado local",true);});
  }catch(e){FBLISTO=false;normaliza();setSync("no disponible — guardado local",true);}
}

/* ===== HELPERS ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Fecha de hoy en la zona del equipo (YYYY-MM-DD). toISOString() da UTC: despues de las 18:00 en Mexico ya es "manana".
function hoyLocal(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
const money0=n=>"$"+Number(n||0).toLocaleString("es-MX",{maximumFractionDigits:0});
function diasA(f){if(!f)return null;return Math.ceil((new Date(f+"T00:00:00")-new Date(new Date().toDateString()))/86400000);}
function ava(nombre){const ini=(nombre||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();const col=PERSON_COLOR[nombre]||"#8A90B0";return `<span class="ava" style="background:${col}">${ini}</span>`;}
function proy(id){return STATE.proyectos.find(p=>p.id===id);}
function avanceProy(p){if(!p.actividades.length)return 0;return Math.round(p.actividades.reduce((a,x)=>a+(x.avance||0),0)/p.actividades.length);}
function bloqueados(p){return p.actividades.filter(a=>a.estado==="Bloqueado").length;}
function faseActual(p){const enc=p.actividades.find(a=>a.estado!=="Terminado");return enc?enc.fase:"Cierre";}
function estadoProy(p){if(bloqueados(p))return "Bloqueado";const av=avanceProy(p);if(av>=100)return "Terminado";if(av>0)return "En proceso";return "Listo para comenzar";}

/* ===== AUTOMATIZACIONES (reglas del spec, hechas visibles como alertas) ===== */
function actsOrdenadas(p){return [...p.actividades].sort((a,b)=>{
  const fa=FASE_ORDEN.indexOf(a.fase),fb=FASE_ORDEN.indexOf(b.fase);
  if(fa!==fb)return fa-fb; return new Date(a.entrega||"2999")-new Date(b.entrega||"2999");});}
function alertasProy(p){
  const al=[];
  // Regla 1: vencida y no terminada -> avisar responsable
  p.actividades.forEach(a=>{const d=diasA(a.entrega);if(a.estado!=="Terminado"&&d!=null&&d<0)
    al.push({icon:"🔴",color:"var(--s-bloq)",txt:`<b>${esc(a.actividad)}</b> venció hace ${-d}d y no está terminada → avisar a <b>${esc(a.resp)}</b>`});});
  // Regla 2: bloqueado -> avisar PM
  p.actividades.forEach(a=>{if(a.estado==="Bloqueado")
    al.push({icon:"🚫",color:"var(--s-bloq)",txt:`<b>${esc(a.actividad)}</b> está bloqueada → avisar al Project Manager`});});
  // Regla 3: terminada cuya siguiente no ha iniciado -> avisar al siguiente
  const ord=actsOrdenadas(p);
  for(let i=0;i<ord.length-1;i++){if(ord[i].estado==="Terminado"&&ord[i+1].estado==="No iniciado")
    al.push({icon:"➡️",color:"var(--s-listo)",txt:`Lista <b>${esc(ord[i].actividad)}</b> → arranca la siguiente: <b>${esc(ord[i+1].actividad)}</b> (${esc(ord[i+1].resp)})`});break;}
  // Regla 4: todo terminado -> cerrar
  if(p.actividades.length&&p.actividades.every(a=>a.estado==="Terminado"))
    al.push({icon:"✅",color:"var(--s-term)",txt:`Todas las actividades terminadas → <b>cerrar el proyecto</b>`});
  return al;
}
function renderAlertasCard(alertas,titulo){
  if(!alertas.length)return `<div class="board"><div class="board-head"><span class="gc" style="background:var(--s-term)"></span><h3>⚡ ${titulo}</h3></div><div style="padding:16px 18px;color:var(--txt3);font-size:13px">Sin alertas. Todo en orden.</div></div>`;
  const rows=alertas.map(a=>`<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 18px;border-bottom:1px solid var(--line)"><span style="font-size:16px">${a.icon}</span><span style="font-size:13px;color:var(--txt2);line-height:1.4">${a.txt}</span></div>`).join("");
  return `<div class="board" style="border-left:4px solid var(--s-bloq)"><div class="board-head"><span class="gc" style="background:var(--s-bloq)"></span><h3>⚡ ${titulo}</h3><span class="count">${alertas.length}</span></div>${rows}</div>`;
}

/* ===== DASHBOARD / SEGUIMIENTO SEMANAL ===== */
function plannedPct(a){
  if(a.estado==="Terminado")return 100;
  if(!a.inicio||!a.entrega)return 0;
  const t0=new Date(a.inicio),t1=new Date(a.entrega),now=new Date(new Date().toDateString());
  if(now>=t1)return 100; if(now<=t0)return 0;
  return Math.round((now-t0)/(t1-t0)*100);
}
function planReal(p){
  if(!p.actividades.length)return {plan:0,real:0};
  const plan=Math.round(p.actividades.reduce((a,x)=>a+plannedPct(x),0)/p.actividades.length);
  const real=avanceProy(p);
  return {plan,real};
}
function vencidas(p){return p.actividades.filter(a=>{const d=diasA(a.entrega);return a.estado!=="Terminado"&&d!=null&&d<0;});}
function proxHitos(p,n){return actsOrdenadas(p).filter(a=>a.estado!=="Terminado").slice(0,n);}

    const {plan,real}=planReal(p);
    const vari=real-plan;

    const variTxt = vari>=0?`<span style="color:var(--s-term)">+${vari}% adelantado</span>`:`<span style="color:var(--s-bloq)">${vari}% atrasado</span>`;
    return `<div class="board">
      <div class="board-head"><span class="gc" style="background:${COLOR[estadoProy(p)]}"></span><h3>${esc(p.nombre)}</h3><span class="count">${esc(p.cliente)}</span></div>
      <div style="padding:16px 18px">
        <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px">
          <div style="flex:1;min-width:200px">
            <div style="font-size:11px;color:var(--txt3);margin-bottom:6px">AVANCE PLANIFICADO VS REAL &nbsp; ${variTxt}</div>
            <div style="position:relative;height:26px;background:var(--panel);border-radius:7px;overflow:hidden">
              <div style="position:absolute;top:0;left:0;height:100%;width:${plan}%;background:#D4DCF0"></div>
              <div style="position:absolute;top:0;left:0;height:100%;width:${real}%;background:${vari<0?'var(--s-bloq)':'var(--s-term)'};opacity:.85"></div>
              <div style="position:absolute;top:0;left:${plan}%;height:100%;width:2px;background:var(--navy)"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--txt3);margin-top:5px"><span>Real: <b style="color:var(--txt)">${real}%</b></span><span>Plan: <b style="color:var(--txt)">${plan}%</b></span></div>
          </div>
          <div style="display:flex;gap:14px">
            <div style="text-align:center"><div style="font-size:22px;font-weight:700;color:${vc.length?'var(--s-bloq)':'var(--txt3)'}">${vc.length}</div><div style="font-size:10px;color:var(--txt3)">VENCIDAS</div></div>
            <div style="text-align:center"><div style="font-size:22px;font-weight:700;color:${bl?'var(--s-bloq)':'var(--txt3)'}">${bl}</div><div style="font-size:10px;color:var(--txt3)">BLOQUEADAS</div></div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--txt3);margin-bottom:6px">PRÓXIMOS HITOS</div>
        ${prox.length?prox.map(a=>{const d=diasA(a.entrega);return `<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)"><span>${esc(a.actividad)} <span style="color:var(--txt3)">· ${esc(a.resp)}</span></span><span class="mono" style="color:${d!=null&&d<0?'var(--s-bloq)':'var(--txt2)'}">${a.entrega||"—"}${d!=null?` (${d<0?'venc.':d+'d'})`:''}</span></div>`}).join(""):'<div style="font-size:12px;color:var(--txt3)">Sin hitos pendientes.</div>'}
      </div></div>`;
  }).join("");
  const totVenc=ps.reduce((a,p)=>a+vencidas(p).length,0);
  const totBloq=ps.reduce((a,p)=>a+bloqueados(p),0);
  $("#v-dashboard").innerHTML=`
    <div class="eyebrow">Seguimiento · reunión semanal de 30 min</div>
    <div class="h1">Dashboard ejecutivo</div>
    <p class="sub">Para tu revisión semanal y para informar a dirección: avance planificado contra real, actividades vencidas y próximos hitos de cada proyecto. La línea negra marca dónde <i>deberías</i> ir; la barra de color, dónde <i>vas</i>.</p>
    <div class="strip">
      <div class="chip"><div class="k">Proyectos</div><div class="v">${ps.length}</div></div>
      <div class="chip"><div class="k">Vencidas (total)</div><div class="v" style="color:${totVenc?'var(--s-bloq)':'inherit'}">${totVenc}</div></div>
      <div class="chip"><div class="k">Bloqueadas (total)</div><div class="v" style="color:${totBloq?'var(--s-bloq)':'inherit'}">${totBloq}</div></div>
      <div class="chip"><div class="k">Valor portafolio</div><div class="v" style="font-size:16px">${money0(ps.reduce((a,p)=>a+(p.valor||0),0))}</div></div>
    </div>
    ${cards}
    ${(()=>{const rs=allRiesgos().filter(r=>r.estatus!=="cerrado").sort((a,b)=>nivelRiesgo(b)-nivelRiesgo(a)).slice(0,6);
      if(!rs.length)return "";
      return `<div class="board"><div class="board-head"><span class="gc" style="background:#E2445C"></span><h3>Riesgos principales</h3><span class="count">top ${rs.length}</span></div><div style="padding:12px 18px">${rs.map(r=>{const n=nivelRiesgo(r);return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(r.desc)} <span style="color:var(--txt3)">· ${esc(r.proyecto)}</span></span><span class="pill" style="background:${nivelColor(n)};color:#fff">${nivelTxt(n)}</span></div>`}).join("")}</div></div>`;})()}`;
}
let VACT="maestro";
function setV(v){document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));$("#v-"+v).classList.add("on");
  VACT=v; renderSidebar();
  if(v==="maestro")renderMaestro(); if(v==="dashboard")renderDashboard(); if(v==="riesgos")renderRiesgos();
  if(v==="bitacora")renderBitacora(); if(v==="solicitudes")renderSolicitudes(); if(v==="proyecto")renderProyecto();
  window.scrollTo(0,0);}
function abrir(id){CUR=id;SUB="tabla";setV("proyecto");}
function renderSidebar(){

/* --- SUB: GANTT --- */
function subGantt(p){
  const acts=actsOrdenadas(p).filter(a=>a.inicio&&a.entrega);
  if(!acts.length)return `<div class="board"><div style="padding:20px;color:var(--txt3)">Agrega fechas de inicio y entrega a las actividades para ver el Gantt.</div></div>`;
  const min=new Date(Math.min(...acts.map(a=>+new Date(a.inicio))));
  const max=new Date(Math.max(...acts.map(a=>+new Date(a.entrega))));
  const span=Math.max(1,(max-min)/86400000);
  const pct=dt=>((new Date(dt)-min)/86400000)/span*100;
  const hoy=new Date(new Date().toDateString());
  const hoyPct=(hoy>=min&&hoy<=max)?((hoy-min)/86400000)/span*100:null;
  // etiquetas de mes
  const meses=[];let cur=new Date(min.getFullYear(),min.getMonth(),1);
  while(cur<=max){meses.push(new Date(cur));cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);}
  const mesLbl=meses.map(m=>`<div style="flex:1;font-size:10.5px;color:var(--txt3);border-left:1px solid var(--line);padding-left:6px;font-family:'DM Mono'">${m.toLocaleDateString("es-MX",{month:"short",year:"2-digit"})}</div>`).join("");
  const rows=acts.map((a,i)=>{
    const l=pct(a.inicio),w=Math.max(1.5,pct(a.entrega)-l);
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div style="width:210px;flex-shrink:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="display:inline-block;width:20px;color:var(--txt3);font-family:'DM Mono';font-size:11px">${i+1}.</span>${esc(a.actividad)}</div>
      <div style="flex:1;position:relative;height:22px;background:var(--panel);border-radius:5px">
        ${hoyPct!=null?`<div style="position:absolute;top:-4px;bottom:-4px;left:${hoyPct}%;width:2px;background:var(--s-bloq);z-index:3"></div>`:''}
        <div style="position:absolute;top:3px;height:16px;left:${l}%;width:${w}%;background:${COLOR[a.estado]};border-radius:5px;min-width:6px" title="${a.inicio} → ${a.entrega}"></div>
      </div></div>`;
  }).join("");
  return `<div class="board"><div class="board-head"><span class="gc" style="background:var(--accent)"></span><h3>Gantt</h3>${hoyPct!=null?'<span class="count" style="color:var(--s-bloq)">línea roja = hoy</span>':''}</div>
    <div style="padding:16px 18px">
      <div style="display:flex;gap:10px;margin-bottom:10px"><div style="width:210px;flex-shrink:0"></div><div style="flex:1;display:flex">${mesLbl}</div></div>
      ${rows}
    </div></div>`+leyenda();
}

/* --- SUB: CONCENTRADO DE AVANCE (del proyecto) --- */
const CEST={"En CEDI":"#00C875","Resuelto":"#00C875","En proceso":"#FDAB3D","Comprometido":"#579BFC","Incompleto":"#E2445C","No programado":"#C4C4C4"};
const CEST_LIST=["En CEDI","Resuelto","En proceso","Comprometido","Incompleto","No programado"];
const AEST={"Lanzado":"#00C875","Sin lanzar":"#E2445C","En captura":"#FDAB3D","Entregado":"#2563EB"};
const AEST_LIST=["Lanzado","Sin lanzar","En captura","Entregado"];
let CFILTRO="todos";
function setCFiltro(f){CFILTRO=f;renderProyecto();}
function pct(ll,b){b=Number(b||0);if(!b)return 0;return Math.round(Number(ll||0)/b*100);}
function sumBloque(cs){return cs.reduce((a,c)=>({b:a.b+Number(c.base||0),l:a.l+Number(c.llevamos||0)}),{b:0,l:0});}
function barra(p_,col){return `<div class="avance"><div class="avbar"><div class="avfill" style="width:${Math.min(100,p_)}%;background:${col}"></div></div><span class="avnum">${p_}%</span></div>`;}
function subConcentrado(p){
  const C=p.concentrado||{areas:[],conceptos:[]};
  const fab=C.conceptos.filter(c=>c.tipo==="fab"), com=C.conceptos.filter(c=>c.tipo==="com");
  const sf=sumBloque(fab), sc=sumBloque(com), st={b:sf.b+sc.b,l:sf.l+sc.l};
  const pf=pct(sf.l,sf.b), pc=pct(sc.l,sc.b), pt=pct(st.l,st.b);
  const abiertos=C.conceptos.filter(c=>Number(c.llevamos||0)<Number(c.base||0));
  const faltan=abiertos.reduce((a,c)=>a+(Number(c.base||0)-Number(c.llevamos||0)),0);

  const filaC=(c,i)=>{const q=pct(c.llevamos,c.base),col=CEST[c.estatus]||"#C4C4C4",falta=Number(c.base||0)-Number(c.llevamos||0);
    return `<tr>
      <td class="grpbar"><span class="gbar" style="background:${col}"></span></td>
      <td class="cellpad mono" style="font-size:11.5px">${esc(c.sku)}</td>
      <td class="cellpad"><b style="font-size:12.5px">${esc(c.desc)}</b>${c.nota?`<div style="font-size:11px;color:var(--txt3);margin-top:3px;line-height:1.45">${esc(c.nota)}</div>`:""}</td>
      <td class="cellpad mono" style="text-align:right">${Number(c.base||0).toLocaleString("es-MX")}</td>
      <td class="cellpad mono" style="text-align:right"><input type="number" value="${Number(c.llevamos||0)}" style="width:70px;text-align:right;font-family:DM Mono,monospace;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 6px" onchange="updConcepto('${p.id}','${c.id}','llevamos',this.value)"></td>
      <td class="cellpad mono" style="text-align:right;color:${falta>0?'var(--s-bloq)':'var(--txt3)'};font-weight:${falta>0?700:400}">${falta>0?falta.toLocaleString("es-MX"):"—"}</td>
      <td style="min-width:130px">${barra(q,col)}</td>

    return `<tr>
      <td class="grpbar"><span class="gbar" style="background:${col}"></span></td>
      <td class="cellpad"><b style="font-size:12.5px">${esc(a.nombre)}</b>${a.nota?`<div style="font-size:11px;color:var(--txt3);margin-top:3px;line-height:1.45">${esc(a.nota)}</div>`:""}</td>
      <td class="cellpad mono" style="font-size:11.5px">${esc(a.pedido)}</td>
      <td class="cellpad mono" style="text-align:right">${Number(a.piezas||0).toLocaleString("es-MX")}</td>

      <td style="text-align:center"><select class="estado" style="background:var(--panel);color:var(--txt);width:calc(100% - 12px);min-width:110px" onchange="updArea('${p.id}','${a.id}','estatus',this.value)">${AEST_LIST.map(s=>`<option ${s===a.estatus?"selected":""}>${s}</option>`).join("")}</select></td>
      <td style="text-align:center"><button class="delbtn" title="Eliminar área" onclick="borrarArea('${p.id}','${a.id}')">✕</button></td>

  const sinLanzar=C.areas.filter(a=>a.estatus==="Sin lanzar").length;

  return `<div class="board" style="border:none;box-shadow:none;background:transparent;margin-bottom:6px">
    <p class="sub" style="margin:0">Concentrado de avance: qué se programó, qué llevamos y qué falta. Separa lo que <b>fabrica planta</b> de lo que es <b>producto comercializado</b>, porque son dos cadenas distintas y un solo porcentaje las esconde.${C.fuente?`<br><span style="font-size:11.5px;color:var(--txt3)">Fuente: ${esc(C.fuente)}</span>`:""}</p></div>

  ${bloque("Fabricación en planta","#2563EB",fab,sf,pf,"Lo que produce Línea Italia. Su avance lo reporta planta y se cierra con entrada a CEDI.")}
  ${bloque("Producto comercializado","#00A896",com,sc,pc,"Compra o importación. No pasa por programación de planta, así que nunca tendrá fecha de producción: su cierre es la recepción confirmada.")}`;
}
function updConcepto(pid,cid,campo,val){const p=proy(pid);const c=(p.concentrado.conceptos||[]).find(x=>x.id===cid);if(!c)return;
  if(campo==="llevamos"){let n=Number(val)||0;if(n<0)n=0;if(n>Number(c.base||0))n=Number(c.base||0);c.llevamos=n;
    if(n>=Number(c.base||0)&&c.estatus!=="Resuelto")c.estatus=(c.tipo==="com"?"Resuelto":"En CEDI");
    else if(n>0&&n<Number(c.base||0))c.estatus="En proceso";}
  else c[campo]=val;
  save();renderProyecto();}
function borrarConcepto(pid,cid){if(!confirm("¿Eliminar este concepto del concentrado?"))return;
  const p=proy(pid);p.concentrado.conceptos=p.concentrado.conceptos.filter(x=>x.id!==cid);save();renderProyecto();}
function modalNuevoConcepto(pid,tipo){
  openModal(`<h3>Nuevo concepto · ${tipo==="fab"?"fabricación":"comercializado"}</h3>
   <label>Clave / SKU</label><input id="cc_s" placeholder="FC-0000">
   <label>Concepto</label><input id="cc_d" placeholder="Descripción del producto">

   <label>Llevamos</label><input id="cc_l" type="number" value="0">
   <label>Estatus</label><select id="cc_e">${CEST_LIST.map(s=>`<option ${s===(tipo==="fab"?"No programado":"Comprometido")?"selected":""}>${s}</option>`).join("")}</select>
   <label>Nota (opcional)</label><input id="cc_n" placeholder="Contexto, folios, fechas">
   <div class="actions"><button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="guardarConcepto('${pid}','${tipo}')">Agregar</button></div>`);
}
function guardarConcepto(pid,tipo){

function updArea(pid,aid,campo,val){const p=proy(pid);const a=(p.concentrado.areas||[]).find(x=>x.id===aid);if(a){a[campo]=val;save();renderProyecto();}}
function borrarArea(pid,aid){if(!confirm("¿Eliminar esta área?"))return;
  const p=proy(pid);p.concentrado.areas=p.concentrado.areas.filter(x=>x.id!==aid);save();renderProyecto();}

function subInformes(p){
  const I=[...(p.informes||[])].sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.id.localeCompare(a.id));
  const conAvance=I.filter(x=>x.avance!=null);
  const tipos={};I.forEach(x=>tipos[x.tipo]=(tipos[x.tipo]||0)+1);
  const items=I.map(x=>`<div style="display:flex;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line)">
     <div style="flex:0 0 88px;text-align:right">
       <div class="mono" style="font-size:12px;font-weight:700;color:var(--accent)">${esc(x.fecha)}</div>
       <div style="font-size:10px;color:var(--txt3);margin-top:3px;text-transform:uppercase;letter-spacing:.4px">${esc(x.tipo)}</div>
       ${x.avance!=null?`<div class="pill n" style="margin-top:6px">${x.avance}%</div>`:""}
     </div>
     <div style="flex:1;border-left:2px solid var(--line);padding-left:15px">
       <b style="font-size:13px;line-height:1.4">${esc(x.titulo)}</b>
       ${x.contenido?`<div style="font-size:12px;color:var(--txt2);margin-top:6px;line-height:1.55">${esc(x.contenido)}</div>`:""}
       ${x.riesgos?`<div style="font-size:11.5px;margin-top:8px;padding:8px 11px;background:#E2445C11;border-left:3px solid #E2445C;border-radius:0 6px 6px 0;line-height:1.5"><b style="color:#E2445C">Riesgos · </b>${esc(x.riesgos)}</div>`:""}
       ${x.acciones?`<div style="font-size:11.5px;margin-top:6px;padding:8px 11px;background:#00A89611;border-left:3px solid #00A896;border-radius:0 6px 6px 0;line-height:1.5"><b style="color:#00A896">Acciones y notas del PM · </b>${esc(x.acciones)}</div>`:""}
     </div>
     <div style="flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:flex-end">
       <button class="btn-ghost" style="padding:3px 9px;font-size:11px" title="Texto para WhatsApp" onclick="modalWhatsApp(textoWhatsApp(proy('${p.id}'),proy('${p.id}').informes.find(i=>i.id==='${x.id}')))">📋 WhatsApp</button>
       ${x.reporte?`<button class="btn-ghost" style="padding:3px 9px;font-size:11px" onclick="modalReporteDia('${p.id}','${x.id}')">Editar</button>`:""}
       <button class="delbtn" style="opacity:.6" title="Eliminar informe" onclick="borrarInforme('${p.id}','${x.id}')">✕</button></div>
   </div>`).join("");
  return `<div class="board" style="border:none;box-shadow:none;background:transparent;margin-bottom:6px">
    <p class="sub" style="margin:0">Bitácora de lo que se comunicó y cuándo. Es el rastro de la gestión: cada informe queda fechado con su contenido, los riesgos vigentes en ese momento y las acciones tomadas. Al cierre, este módulo <b>es</b> el expediente del proyecto.</p></div>
  <div class="strip">
    <div class="chip"><div class="k">Informes registrados</div><div class="v">${I.length}</div></div>
    <div class="chip"><div class="k">Último reporte</div><div class="v" style="font-size:14px">${I.length?esc(I[0].fecha):"—"}</div></div>
    <div class="chip"><div class="k">Con avance declarado</div><div class="v">${conAvance.length}</div></div>
    <div class="chip"><div class="k">Corte de estatus</div><div class="v" style="font-size:14px">${p.corte?esc(p.corte):"—"}</div></div>
  </div>
  <div class="board">
    <div class="board-head"><span class="gc" style="background:var(--accent)"></span><h3>Informes y reportes</h3><span class="count">${I.length} entradas</span></div>
    ${items||'<div class="cellpad" style="padding:18px;color:var(--txt3);font-size:13px">Sin informes registrados.</div>'}
    <div class="addrow" onclick="modalNuevoInforme('${p.id}')">+ Registrar informe</div>
  </div>`;
}
function borrarInforme(pid,iid){if(!confirm("¿Eliminar este informe de la bitácora?"))return;

/* ===== REPORTE DEL DÍA (fase 2) =====
   Se captura UNA vez aqui y la app arma el texto para WhatsApp: el grupo deja de ser
   la fuente y pasa a ser solo el canal. Cada hallazgo del reporte entra a la bitacora. */
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fechaCorta=ds=>{const [y,m,d]=String(ds||"").split("-");return d?`${Number(d)}/${MESES[Number(m)-1]}`:ds;};
// Sedes a partir de las areas del concentrado: "Oaxaca Nivel 1" y "Oaxaca Nivel 2" -> "Oaxaca".
function sedesDe(p){const s=[];(p.concentrado&&p.concentrado.areas||[]).forEach(a=>{
  const n=String(a.nombre||"").replace(/\s+(nivel\s*\d+|n\d+|pb|pa|anexo|planta\s+\w+)$/i,"").trim();if(n&&!s.includes(n))s.push(n);});return s;}
const lineas=t=>String(t||"").split(/\n+/).map(x=>x.replace(/^\s*(?:[-•*]|\d+[.)])\s*/,"").trim()).filter(Boolean);
const KEY_BORR=pid=>KEY+"_borrador_"+pid;

function filaHz(h){h=h||{};return `<div class="rd-row rd-hz" data-hid="${esc(h.hid||"")}">
  <input class="hz-t" placeholder="¿Qué se encontró?" value="${esc(h.titulo||"")}">
  <select class="hz-f">${Object.entries(FAMILIAS).map(([k,f])=>`<option value="${k}" ${k===(h.fam||"A")?"selected":""}>${k} · ${esc(f.nombre.slice(0,22))}</option>`).join("")}</select>
  <select class="hz-i">${["alto","medio","bajo"].map(x=>`<option ${x===(h.impacto||"medio")?"selected":""}>${x}</option>`).join("")}</select>
  <button title="Quitar" onclick="this.parentNode.remove();guardaBorrador()">✕</button></div>`;}
function filaPd(x){x=x||{};return `<div class="rd-row pd rd-pd">
  <input class="pd-t" placeholder="Pendiente" value="${esc(x.txt||"")}">
  <input class="pd-r" placeholder="Responsable" value="${esc(x.resp||"")}">
  <button title="Quitar" onclick="this.parentNode.remove();guardaBorrador()">✕</button></div>`;}

function modalReporteDia(pid,iid){
  const p=proy(pid);if(!p)return;
  const prev=iid?(p.informes||[]).find(x=>x.id===iid):null;
  let r=prev&&prev.reporte?JSON.parse(JSON.stringify(prev.reporte)):null;
  let fecha=prev?prev.fecha:hoyLocal(),avance=prev&&prev.avance!=null?prev.avance:"",titulo=prev?prev.titulo:"";
  if(!prev){try{const b=JSON.parse(localStorage.getItem(KEY_BORR(pid))||"null");if(b){r=b.reporte;fecha=b.fecha||fecha;avance=b.avance??"";titulo=b.titulo||"";}}catch(e){Falla.registrar('leer borrador',e);}}
  r=r||{sede:"",dia:"",dias:"",avance:[],cerrado:[],hallazgos:[],pendientes:[],riesgo:""};
  const sedes=sedesDe(p);
  openModal(`<h3>📝 Reporte del día · ${esc(p.nombre)}${prev?' <span class="rd-meta">(editando)</span>':''}</h3>
   <div class="rd-meta" style="margin:-6px 0 6px">Captúralo aquí una vez; al guardar se arma el texto para WhatsApp y los hallazgos entran a la bitácora.${!prev&&localStorage.getItem(KEY_BORR(pid))?' <b>Se recuperó tu borrador.</b>':''}</div>
   <div class="rd-grid">
     <div><label>Fecha</label><input id="rd_f" type="date" value="${esc(fecha)}"></div>
     <div><label>Sede</label><select id="rd_s"><option value="">General</option>${sedes.map(s=>`<option ${s===r.sede?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
     <div><label>Día / de</label><div style="display:flex;gap:4px"><input id="rd_d" type="number" min="1" placeholder="2" value="${esc(r.dia)}"><input id="rd_dt" type="number" min="1" placeholder="7" value="${esc(r.dias)}"></div></div>
     <div><label>Avance %</label><input id="rd_a" type="number" min="0" max="100" placeholder="opcional" value="${esc(avance)}"></div>
   </div>
   <label>Título (opcional, se arma solo si lo dejas vacío)</label><input id="rd_ti" value="${esc(titulo)}" placeholder="Ej. Oaxaca día 2 · nivel 3 en armado">
   <div class="rd-sec">Avance <span class="hint">un punto por renglón</span></div><textarea id="rd_av" rows="3">${esc((r.avance||[]).join("\n"))}</textarea>
   <div class="rd-sec">Cerrado hoy <span class="hint">un punto por renglón</span></div><textarea id="rd_ce" rows="3">${esc((r.cerrado||[]).join("\n"))}</textarea>
   <div class="rd-sec">Hallazgos <span class="hint">entran a la bitácora del proyecto</span></div>
   <div id="rd_hz">${(r.hallazgos||[]).map(filaHz).join("")}</div>
   <button class="rd-add" onclick="$('#rd_hz').insertAdjacentHTML('beforeend',filaHz());guardaBorrador()">＋ hallazgo</button>

   <div class="rd-sec">Riesgo abierto</div><textarea id="rd_ri" rows="2">${esc(r.riesgo||"")}</textarea>
   <div class="actions">
     ${!prev?`<button class="btn-ghost" style="margin-right:auto" onclick="descartarBorrador('${pid}')">Limpiar</button>`:""}

function guardarReporteDia(pid,iid){
  const p=proy(pid);const d=leerReporteDia(),r=d.reporte;
  if(!r.avance.length&&!r.cerrado.length&&!r.hallazgos.length&&!r.pendientes.length&&!r.riesgo){alert("El reporte está vacío.");return;}
  if(!STATE.hallazgos)STATE.hallazgos=[];
  // Hallazgos nuevos -> bitacora; los ya registrados (editando) solo actualizan titulo/familia/impacto.
  r.hallazgos.forEach((h,i)=>{
    const ex=h.hid&&STATE.hallazgos.find(x=>x.id===h.hid);
    if(ex){ex.titulo=h.titulo;ex.fam=h.fam;ex.impacto=h.impacto;return;}
    h.hid="h"+Date.now()+"_"+i;
    STATE.hallazgos.push({id:h.hid,fecha:d.fecha,proyecto:p.nombre,titulo:h.titulo,detalle:"Registrado desde el reporte del día.",deteccion:"",accion:"",leccion:"",
      fam:h.fam,resp:"",impacto:h.impacto,estatus:"abierto",recurrente:false,sede:r.sede||"",momento:r.sede?"en sitio":"",origen:"reporte del día"});
  });
  const titulo=d.titulo||[r.sede||p.nombre,r.dia?`día ${r.dia}${r.dias?" de "+r.dias:""}`:"",r.avance[0]||r.cerrado[0]||""].filter(Boolean).join(" · ").slice(0,120);
  const inf={id:iid||("i"+Date.now()),fecha:d.fecha,tipo:"Resumen del día",titulo,avance:d.avance,
    contenido:[r.avance.join(". "),r.cerrado.length?"Cerrado hoy: "+r.cerrado.join(". "):""].filter(Boolean).join("\n"),
    riesgos:r.riesgo,acciones:[r.hallazgos.length?"Hallazgos: "+r.hallazgos.map(h=>h.titulo).join("; "):"",r.pendientes.length?"Pendientes 24 h: "+r.pendientes.map(x=>x.txt+(x.resp?" — "+x.resp:"")).join("; "):""].filter(Boolean).join("\n"),
    reporte:r};
  p.informes=p.informes||[];
  const i=p.informes.findIndex(x=>x.id===inf.id);if(i>=0)p.informes[i]=inf;else p.informes.push(inf);
  if(!iid){try{localStorage.removeItem(KEY_BORR(pid));}catch(e){}}
  save();renderProyecto();modalWhatsApp(textoWhatsApp(p,inf));
}
// Texto con formato de WhatsApp (*negritas*), igual a la estructura del reporte del 22-sep.
function textoWhatsApp(p,x){
  const r=x.reporte,L=[];
  const num=a=>a.map((t,i)=>`${i+1}. ${t}`);
  if(r){
    L.push(`*Reporte diario · PROYECTO ${String(p.nombre).toUpperCase()}${r.sede?" – "+r.sede.toUpperCase():""}*`);
    L.push([`Reporte ${fechaCorta(x.fecha)}`,r.dia?`Día ${r.dia}${r.dias?" de "+r.dias:""}`:"",x.avance!=null?`Avance ${x.avance} %`:""].filter(Boolean).join(" · "));
    if(r.avance.length)L.push("","*AVANCE*",...num(r.avance));
    if(r.cerrado.length)L.push("","*CERRADO HOY*",...num(r.cerrado));
    if(r.hallazgos.length)L.push("","*HALLAZGOS*",...r.hallazgos.map(h=>`- ${h.titulo} (Fam ${h.fam} · ${h.impacto})`));
    if(r.pendientes.length)L.push("","*PENDIENTES 24 HRS*",...r.pendientes.map(t=>`- ${t.txt}${t.resp?" — "+t.resp:""}`));
    if(r.riesgo)L.push("","*RIESGO ABIERTO*",r.riesgo);
  }else{ // informes capturados antes de la fase 2
    L.push(`*${x.tipo} · ${p.nombre}* — ${fechaCorta(x.fecha)}${x.avance!=null?` · Avance ${x.avance} %`:""}`,"",`*${x.titulo}*`);
    if(x.contenido)L.push("",x.contenido);
    if(x.riesgos)L.push("","*Riesgos:* "+x.riesgos);
    if(x.acciones)L.push("","*Acciones:* "+x.acciones);
  }
  return L.join("\n");
}

/* --- SUB: DASHBOARD DEL PROYECTO --- */
function subDashboard(p){
  const av=avanceProy(p);
  const porEst={};ESTADOS.forEach(e=>porEst[e]=p.actividades.filter(a=>a.estado===e).length);
  const maxEst=Math.max(1,...Object.values(porEst));
  const vc=vencidas(p),prox=proxHitos(p,3);
  // carga por responsable (avance promedio)
  const resp={};p.actividades.forEach(a=>{(resp[a.resp]=resp[a.resp]||[]).push(a.avance);});
  const carga=Object.entries(resp).map(([r,arr])=>({r,pct:Math.round(arr.reduce((x,y)=>x+y,0)/arr.length)})).sort((a,b)=>b.pct-a.pct);
  // donut
  const R=52,C=2*Math.PI*R,off=C*(1-av/100);
  const donut=`<svg viewBox="0 0 130 130" style="width:150px;height:150px"><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--panel)" stroke-width="14"/><circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--s-term)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"/><text x="65" y="72" text-anchor="middle" font-size="26" font-weight="700" fill="var(--txt)">${av}%</text></svg>`;
  const barsEst=ESTADOS.map(e=>`<div style="text-align:center;flex:1"><div style="height:90px;display:flex;align-items:flex-end;justify-content:center"><div style="width:56%;height:${porEst[e]/maxEst*100}%;background:${COLOR[e]};border-radius:5px 5px 0 0;min-height:3px;position:relative"><span style="position:absolute;top:-18px;left:0;right:0;font-size:12px;font-weight:700">${porEst[e]}</span></div></div><div style="font-size:9px;color:var(--txt3);margin-top:5px;line-height:1.15;min-height:22px">${e}</div></div>`).join("");
  const cargaHtml=carga.map(c=>`<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px"><span class="person" style="width:130px;flex-shrink:0">${ava(c.r)}<span style="font-size:11.5px">${esc(c.r)}</span></span><div class="avbar" style="flex:1"><div class="avfill" style="width:${c.pct}%;background:${c.pct>=60?'var(--s-term)':'var(--s-proc)'}"></div></div><span class="avnum">${c.pct}%</span></div>`).join("");
  return `<div class="dashgrid">
    <div class="board"><div class="board-head"><h3>Avance general</h3></div><div style="padding:18px;display:flex;justify-content:center">${donut}</div></div>
    <div class="board"><div class="board-head"><h3>Actividades por estado</h3></div><div style="padding:22px 18px 14px;display:flex;gap:6px">${barsEst}</div></div>
    <div class="board"><div class="board-head"><h3>Actividades vencidas</h3></div><div style="padding:18px;text-align:center"><div style="font-size:46px;font-weight:700;color:${vc.length?'var(--s-bloq)':'var(--s-term)'}">${vc.length}</div><div style="font-size:12px;color:var(--txt3)">${vc.length?'requieren atención':'¡Buen trabajo!'}</div></div></div>
    <div class="board"><div class="board-head"><h3>Próximas entregas</h3></div><div style="padding:14px 18px">${prox.length?prox.map((a,i)=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)"><span>${i+1}. ${esc(a.actividad)}</span><span class="mono" style="color:var(--txt3)">${a.entrega||"—"}</span></div>`).join(""):'<div style="color:var(--txt3);font-size:12px">Sin pendientes.</div>'}</div></div>
    <div class="board" style="grid-column:1/-1"><div class="board-head"><h3>Carga de trabajo por responsable</h3></div><div style="padding:16px 18px">${cargaHtml}</div></div>
    ${(()=>{const rs=(p.riesgos||[]).filter(r=>r.estatus!=="cerrado").sort((a,b)=>nivelRiesgo(b)-nivelRiesgo(a));if(!rs.length)return "";return `<div class="board" style="grid-column:1/-1"><div class="board-head"><span class="gc" style="background:#E2445C"></span><h3>Riesgos principales</h3><span class="count">${rs.length}</span></div><div style="padding:12px 18px">${rs.map(r=>{const n=nivelRiesgo(r);return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(r.desc)} <span style="color:var(--txt3)">· ${esc(r.resp)}</span></span><span class="pill" style="background:${nivelColor(n)};color:#fff">${nivelTxt(n)}</span></div>`}).join("")}</div></div>`;})()}

/* ===== BITÁCORA DE HALLAZGOS (portafolio + Pareto) ===== */
function renderBitacora(){
  const H=STATE.hallazgos||[];
  // Todas las familias definidas (antes A–D fijas: E y F no aparecian en el Pareto global).
  const cnt=Object.fromEntries(Object.keys(FAMILIAS).map(k=>[k,0]));H.forEach(h=>{if(cnt[h.fam]!=null)cnt[h.fam]++;});
  const total=H.length||1;
  const arr=Object.entries(cnt).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const max=Math.max(1,...arr.map(a=>a.v));
  let acc=0;const W=680,Hh=250,padL=40,padB=54,padT=24,plot=Hh-padB-padT,bw=(W-padL-40)/arr.length;
  let bars="",dots=[],labels="";
  arr.forEach((a,i)=>{const x=padL+i*bw,cx=x+bw/2,bh=a.v/max*plot,y=padT+plot-bh;const col=FAMILIAS[a.k].color;
    bars+=`<rect x="${x+bw*0.2}" y="${y}" width="${bw*0.6}" height="${bh}" rx="5" fill="${col}"/><text x="${cx}" y="${y-7}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--txt)">${a.v}</text>`;
    acc+=a.v;const py=padT+plot-(acc/total)*plot;dots.push([cx,py,Math.round(acc/total*100)]);
    labels+=`<text x="${cx}" y="${Hh-padB+18}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--txt)">Fam ${a.k}</text>`;});
  const poly=dots.map(d=>`${d[0]},${d[1]}`).join(" ");
  const dHtml=dots.map(d=>`<circle cx="${d[0]}" cy="${d[1]}" r="4" fill="var(--txt)"/><text x="${d[0]}" y="${d[1]-9}" text-anchor="middle" font-size="10" fill="var(--txt)">${d[2]}%</text>`).join("");
  const dom=arr[0];
  const rows=[...H].sort((a,b)=>a.fam.localeCompare(b.fam)).map((h,i)=>`<tr>
    <td class="cellpad mono">${String(i+1).padStart(2,"0")}</td>
    <td class="cellpad"><b>${esc(h.titulo)}</b><div style="font-size:11.5px;color:var(--txt3);margin-top:2px">${esc(h.detalle)}</div><div style="font-size:10.5px;color:var(--txt3);margin-top:2px">${esc(h.proyecto)} · ${esc(h.resp)}</div></td>
    <td style="text-align:center"><span class="pill" style="background:${FAMILIAS[h.fam].color}22;color:${FAMILIAS[h.fam].color}">${h.fam}</span>${h.recurrente?'<div style="font-size:9px;color:#E2445C;font-family:DM Mono;margin-top:3px">RECURRENTE</div>':''}</td>
    <td class="cellpad"><span class="pill ${h.impacto==='alto'?'r':h.impacto==='medio'?'a':'n'}">${h.impacto}</span></td>
    <td style="text-align:center"><select class="estado" style="color:var(--txt);font-weight:600" onchange="updHallazgo('${h.id}',this.value)">${["abierto","por corregir","en curso","corregido","resuelto","cerrado"].map(s=>`<option ${s===h.estatus?'selected':''}>${s}</option>`).join("")}</select></td>
  </tr>`).join("");
  const contra=Object.entries(FAMILIAS).map(([k,f])=>`<div class="board" style="border-top:3px solid ${f.color};margin-bottom:0">
    <div style="padding:14px 16px"><div style="display:flex;align-items:center;gap:9px;margin-bottom:8px"><span style="width:26px;height:26px;border-radius:7px;background:${f.color};color:#fff;display:grid;place-items:center;font-weight:700;font-family:DM Mono">${k}</span><b style="font-size:13px">Familia ${k} · ${cnt[k]} caso(s)</b></div>
    <div style="font-size:12.5px;color:var(--txt2);line-height:1.5">${esc(f.contra)}</div>
    <div style="font-size:11px;color:var(--txt3);margin-top:9px;padding-top:8px;border-top:1px solid var(--line)">Dueño: <b style="color:var(--accent)">${esc(f.dueno)}</b></div></div></div>`).join("");
  $("#v-bitacora").innerHTML=`
    <div class="eyebrow">Aprendizaje · Directiva Fernando</div>
    <div class="h1">Bitácora de Hallazgos</div>
    <p class="sub">Los hallazgos de todos los proyectos, clasificados por familia de causa raíz. Sirven para aprender: atacas la familia que más se repite con una sola contramedida, y no vuelve a pasar en el siguiente proyecto.</p>
    <div class="strip">
      <div class="chip"><div class="k">Hallazgos</div><div class="v">${H.length}</div></div>
      <div class="chip"><div class="k">Familia dominante</div><div class="v" style="color:#E2445C">${Math.round(dom.v/total*100)}%</div></div>
      <div class="chip"><div class="k">Abiertos</div><div class="v" style="color:#FDAB3D">${H.filter(h=>['abierto','por corregir','en curso'].includes(h.estatus)).length}</div></div>
      <div class="chip"><div class="k">Contramedidas</div><div class="v" style="color:#00C875">4</div></div>
    </div>
    <div class="board"><div class="board-head"><span class="gc" style="background:#E2445C"></span><h3>Pareto por familia</h3></div>
      <div style="padding:12px 18px"><svg viewBox="0 0 ${W} ${Hh}" style="width:100%;max-width:640px"><line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plot}" stroke="var(--line)"/><line x1="${padL}" y1="${padT+plot}" x2="${W-40}" y2="${padT+plot}" stroke="var(--line)"/>${bars}<polyline points="${poly}" fill="none" stroke="var(--txt)" stroke-width="2"/>${dHtml}${labels}</svg>
      <p class="note">La <b>Familia ${dom.k} (${FAMILIAS[dom.k].nombre})</b> concentra ${dom.v} de ${H.length} hallazgos. Una sola contramedida en el intake desactiva la mayor parte del problema — para todos los proyectos.</p></div></div>
    <div class="board"><div class="board-head"><span class="gc" style="background:var(--accent)"></span><h3>Registro de hallazgos</h3><span class="count">${H.length}</span></div>
      <table class="tbl"><thead><tr><th>#</th><th>Hallazgo</th><th style="text-align:center">Familia</th><th>Impacto</th><th style="text-align:center;width:140px">Estatus</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="addrow" onclick="modalNuevoHallazgo()">+ Registrar hallazgo</div></div>
    <div style="font-size:13px;font-weight:700;margin:6px 0 10px">Contramedidas replicables</div>
    <div class="dashgrid" style="grid-template-columns:repeat(2,1fr)">${contra}</div>`;
}
function updHallazgo(id,val){const h=STATE.hallazgos.find(x=>x.id===id);if(h){h.estatus=val;save();renderBitacora();}}
function modalNuevoHallazgo(){
  openModal(`<h3>Registrar hallazgo</h3>
   <label>Título</label><input id="h_t" placeholder="¿Qué se detectó?">
   <label>Detalle</label><input id="h_d" placeholder="Descripción breve">
   <label>Familia</label><select id="h_f">${Object.entries(FAMILIAS).map(([k,f])=>`<option value="${k}">${k} · ${f.nombre}</option>`).join("")}</select>
   <label>Proyecto</label><select id="h_p">${STATE.proyectos.map(p=>`<option>${esc(p.nombre)}</option>`).join("")}</select>
   <label>Responsable de origen</label><input id="h_r" placeholder="Área o persona">
   <label>Impacto</label><select id="h_i"><option>alto</option><option selected>medio</option><option>bajo</option></select>
   <div class="actions"><button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="guardarHallazgo()">Guardar</button></div>`);
}
function guardarHallazgo(){
  const t=$("#h_t").value.trim();if(!t){alert("Escribe el título");return;}
  STATE.hallazgos.push({id:"h"+Date.now(),fecha:hoyLocal(),proyecto:$("#h_p").value,titulo:t,detalle:$("#h_d").value,fam:$("#h_f").value,resp:$("#h_r").value,recurrente:false,impacto:$("#h_i").value,estatus:"abierto"});
  save();closeModal();renderBitacora();
}

/* ===== SOLICITUDES ===== */
function renderSolicitudes(){
  if(!STATE.solicitudes)STATE.solicitudes=[];
  const rows=STATE.solicitudes.map(s=>`<tr><td class="cellpad"><b>${esc(s.titulo)}</b><div style="font-size:11px;color:var(--txt3)">${esc(s.desc||'')}</div></td><td class="cellpad">${esc(s.de)}</td><td class="cellpad mono">${s.fecha}</td><td style="text-align:center"><span class="pill ${s.estatus==='atendida'?'g':'a'}">${s.estatus}</span></td></tr>`).join("");
  $("#v-solicitudes").innerHTML=`
    <div class="eyebrow">Recibir solicitudes</div>
    <div class="h1">Solicitudes</div>
    <p class="sub">Peticiones que llegan de otras áreas (nuevos proyectos, cambios, urgencias). Aquí las registras para que nada se pierda en el chat o el correo.</p>
    <div class="board"><div class="board-head"><span class="gc" style="background:var(--accent)"></span><h3>Bandeja de solicitudes</h3><span class="count">${STATE.solicitudes.length}</span></div>
      <table class="tbl"><thead><tr><th>Solicitud</th><th>De</th><th>Fecha</th><th style="text-align:center;width:110px">Estatus</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="cellpad" style="color:var(--txt3)">Sin solicitudes. Usa el botón para registrar una.</td></tr>'}</tbody></table>
      <div class="addrow" onclick="modalNuevaSolicitud()">+ Registrar solicitud</div></div>`;
}
function modalNuevaSolicitud(){
  openModal(`<h3>Nueva solicitud</h3>
   <label>Título</label><input id="s_t" placeholder="¿Qué se solicita?">
   <label>Descripción</label><input id="s_d" placeholder="Detalle">
   <label>De (área/persona)</label><input id="s_de" placeholder="Quién la pide">
   <div class="actions"><button class="btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="guardarSolicitud()">Guardar</button></div>`);
}
function guardarSolicitud(){
  const t=$("#s_t").value.trim();if(!t){alert("Escribe el título");return;}
  if(!STATE.solicitudes)STATE.solicitudes=[];
  STATE.solicitudes.push({id:"s"+Date.now(),titulo:t,desc:$("#s_d").value,de:$("#s_de").value||"—",fecha:hoyLocal(),estatus:"pendiente"});
  save();closeModal();renderSolicitudes();
}

/* ===== IMPORTAR / EXPORTAR (JSON estándar) ===== */
function modalImportar(){
  openModal(`<h3>Importar / Exportar datos</h3>
   <p style="font-size:12.5px;color:var(--txt2);margin-bottom:10px">Pega el JSON estandarizado (el que te devuelve el análisis del chat) y presiona <b>Importar</b>. O usa <b>Exportar</b> para copiar el estado actual y mandármelo a analizar.</p>
   <textarea id="imp_txt" style="width:100%;height:170px;font-family:'DM Mono';font-size:11px;border:1px solid var(--line);border-radius:8px;padding:10px" placeholder='{"proyecto":"...","actividades":[...]}'></textarea>
   <div class="actions"><button class="btn-ghost" onclick="exportarJSON()">⬇ Exportar (copiar)</button><button class="btn" onclick="importarJSON()">⬆ Importar</button></div>
   <p style="font-size:11px;color:var(--txt3);margin-top:10px">Importar reemplaza proyectos con el mismo id y agrega los nuevos. Hallazgos también se fusionan.</p>`);
}
// Respaldo COMPLETO: lo que exportarJSON dejaba fuera (solicitudes y contramedidas) tambien va.
function datosRespaldo(){return {_app:"gestor-pm",_exportado:new Date().toISOString(),schema:STATE.schema,
  proyectos:STATE.proyectos,hallazgos:STATE.hallazgos,solicitudes:STATE.solicitudes||[],contramedidas:STATE.contramedidas||{},hallazgosBorrados:STATE.hallazgosBorrados||[]};}
function descargarRespaldo(motivo){
  try{
    const blob=new Blob([JSON.stringify(datosRespaldo(),null,2)],{type:"application/json"});
    const a=document.createElement("a");const hh=new Date();
    a.href=URL.createObjectURL(blob);
    a.download=`gestor-pm-respaldo-${hoyLocal()}-${String(hh.getHours()).padStart(2,"0")}${String(hh.getMinutes()).padStart(2,"0")}${motivo?"-"+motivo:""}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    return true;
  }catch(e){Falla.critica('descargar el respaldo',e);return false;}
}
function exportarJSON(){const t=$("#imp_txt");t.value=JSON.stringify(datosRespaldo(),null,2);t.select();try{document.execCommand("copy");}catch(e){Falla.registrar('exportarJSON',e);}alert("Estado copiado al cuadro. Cópialo y pégamelo en el chat.");}
function importarJSON(){
  let data;try{data=JSON.parse($("#imp_txt").value.replace(/^﻿/,""));}catch(e){alert("El JSON no es válido.");return;}
  // Validar ANTES de tocar nada: un dato mal formado puede romper la pantalla o borrar un proyecto.
  const errs=[],res=[];
  if(!Array.isArray(data.proyectos)&&!(data.proyecto&&Array.isArray(data.actividades))&&!Array.isArray(data.hallazgos))
    errs.push("No trae 'proyectos', 'proyecto + actividades' ni 'hallazgos'.");
  (Array.isArray(data.proyectos)?data.proyectos:[]).forEach((np,i)=>{
    if(!np||typeof np.id!=="string"||!np.id){errs.push(`Proyecto #${i+1} sin id.`);return;}
    if(typeof np.nombre!=="string"||!np.nombre)errs.push(`Proyecto ${np.id} sin nombre.`);
    ["actividades","riesgos","informes"].forEach(k=>{if(np[k]!=null&&!Array.isArray(np[k]))errs.push(`Proyecto ${np.id}: '${k}' no es una lista.`);});
    const ex=STATE.proyectos.find(p=>p.id===np.id);
    res.push(ex?`• Reemplaza "${ex.nombre}": ${(ex.actividades||[]).length} → ${(np.actividades||[]).length} actividades, ${(ex.riesgos||[]).length} → ${(np.riesgos||[]).length} riesgos, ${(ex.informes||[]).length} → ${(np.informes||[]).length} informes`
               :`• Agrega proyecto nuevo "${np.nombre}"`);
  });
  if(Array.isArray(data.hallazgos)){
    data.hallazgos.forEach(h=>{if(!h||!h.id)errs.push("Hay un hallazgo sin id.");else if(!FAMILIAS[h.fam])errs.push(`Hallazgo ${h.id}: familia '${h.fam}' no existe.`);});
    const nuevos=data.hallazgos.filter(h=>h&&!STATE.hallazgos.some(x=>x.id===h.id)).length;
    res.push(`• Hallazgos: ${nuevos} nuevos, ${data.hallazgos.length-nuevos} actualizados`);
  }
  if(data.proyecto&&Array.isArray(data.actividades))res.push(`• Agrega ${data.actividades.length} actividades a "${data.proyecto}"`);
  if(Array.isArray(data.solicitudes))res.push(`• Solicitudes: ${data.solicitudes.length}`);
  if(data.contramedidas&&typeof data.contramedidas==="object")res.push("• Contramedidas por familia");
  if(errs.length){alert("No se importó nada. Corrige esto primero:\n\n"+errs.slice(0,12).join("\n"));return;}
  if(!confirm("Vas a importar:\n\n"+res.join("\n")+"\n\nAntes se descargará un respaldo de lo actual. ¿Continuar?"))return;
  if(!descargarRespaldo("antes-de-importar")){alert("No se pudo descargar el respaldo previo; no se importó nada.");return;}
  let n=0;
  if(Array.isArray(data.proyectos))data.proyectos.forEach(np=>{const i=STATE.proyectos.findIndex(p=>p.id===np.id);if(i>=0)STATE.proyectos[i]=np;else STATE.proyectos.push(np);n++;});
  else if(data.proyecto&&Array.isArray(data.actividades)){let p=STATE.proyectos.find(x=>x.nombre===data.proyecto);
    if(!p){p={id:"p"+Date.now(),nombre:data.proyecto,cliente:data.cliente||"",valor:data.valor||0,inauguracion:data.inauguracion||"",actividades:[],riesgos:[]};STATE.proyectos.push(p);}
    data.actividades.forEach(a=>p.actividades.push(act(a.fase||"Planeación",a.actividad,a.responsable||a.resp||"Por definir",a.inicio||"",a.entrega||"",a.estado||"No iniciado",a.prioridad)));n++;}
  if(Array.isArray(data.hallazgos)){if(!STATE.hallazgos)STATE.hallazgos=[];data.hallazgos.forEach(h=>{const i=STATE.hallazgos.findIndex(x=>x.id===h.id);if(i>=0)STATE.hallazgos[i]=h;else STATE.hallazgos.push(h);});}
  if(Array.isArray(data.solicitudes)){if(!STATE.solicitudes)STATE.solicitudes=[];data.solicitudes.forEach(s=>{if(!s||!s.id)return;const i=STATE.solicitudes.findIndex(x=>x.id===s.id);if(i>=0)STATE.solicitudes[i]=s;else STATE.solicitudes.push(s);});}
  if(data.contramedidas&&typeof data.contramedidas==="object")STATE.contramedidas=Object.assign(STATE.contramedidas||{},data.contramedidas);
  normaliza();
  save();closeModal();setV("maestro");alert("Importado. Se actualizaron "+n+" proyecto(s).");
}

normaliza();
renderSidebar();
renderMaestro();
bootFirebase();
</script>
